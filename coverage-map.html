<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>National Zoning Atlas — Coverage by State</title>
        <!-- This page is embedded in an iframe: send every link to the top-level
             window so navigation replaces the host page, not the map. -->
        <base target="_top" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
        <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
        <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>

        <style>
            .lul-coverage {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                color: #393348;
                /* No width cap: the map takes whatever the embed gives it and the
                   padding keeps it off the edges. */
                margin: 0 auto;
                padding: 20px 20px 20px;
                box-sizing: border-box;
                /* Fills whatever height the frame gives it — 100vh is the iframe's own
                   viewport, so the host sizes the map by sizing the iframe. The floor is
                   the point where the info card and the key would meet in the left
                   margin; below it they'd overlap, so the map stops shrinking there and
                   the frame scrolls instead. */
                height: 100vh;
                min-height: 450px;
                max-height: 900px;
                display: flex;
                flex-direction: column;
            }
            /* ---- map shell ---- */
            #lul-coverage-map {
                width: 100%;
                /* absorbs the leftover height rather than setting it */
                flex: 1 1 auto;
                min-height: 0;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.15);
                position: relative;
                background: #fff;
                overflow: hidden;
            }
            #lul-coverage-map canvas {
                cursor: default;
            }

            /* ---- identity + national stats, top left ---- */
            .lul-infocard {
                position: absolute;
                top: 12px;
                left: 12px;
                z-index: 4;
                /* just wide enough that "zoning pages" stays on one line */
                width: 212px;
                box-sizing: border-box;
                background: #fff;
                border: 1px solid rgba(57, 51, 72, 0.12);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                padding: 12px 14px 10px;
            }
            /* embeds that ask for a bare map — see the `stats` URL parameter */
            .lul-infocard.is-hidden {
                display: none;
            }
            .lul-infocard__head {
                display: flex;
                align-items: center;
                gap: 11px;
            }
            .lul-infocard__logo {
                width: 36px;
                height: 36px;
                flex: none;
                display: block;
            }
            /* the vertical counterpart of the rules between the stats */
            .lul-infocard__rule {
                width: 1px;
                flex: none;
                align-self: stretch;
                background: rgba(57, 51, 72, 0.15);
            }
            .lul-infocard__title {
                font-size: 10.5px;
                font-weight: 700;
                line-height: 1.3;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: #393348;
            }

            /* shared caret for the two collapsible overlays */
            .lul-caret-btn {
                margin-left: auto;
                flex: none;
                display: flex;
                align-items: center;
                border: none;
                background: none;
                padding: 2px;
                cursor: pointer;
                color: rgba(57, 51, 72, 0.45);
            }
            .lul-caret-btn:hover {
                color: #393348;
            }
            .lul-caret-btn svg {
                width: 11px;
                height: 11px;
                transition: transform 0.15s ease;
            }
            .lul-infocard.is-collapsed .lul-caret-btn svg,
            .lul-legend.is-collapsed .lul-caret-btn svg {
                transform: rotate(-90deg);
            }
            .lul-infocard.is-collapsed #lul-infostats {
                display: none;
            }
            /* One continuous card: a single rule under the header, then the four stats
               with one unbroken vertical between the columns. No per-cell horizontals —
               they only ever added up to broken segments. */
            #lul-infostats {
                display: grid;
                /* equal columns; the card is sized so the wider label ("zoning pages")
                   just fits, which keeps the leftover space in each column small */
                grid-template-columns: 1fr 1fr;
                border-top: 1px solid rgba(57, 51, 72, 0.1);
                margin-top: 11px;
                padding-top: 4px;
            }
            .lul-infostat {
                /* no row gap, so the divider beside it runs the full height uninterrupted */
                padding: 8px 0;
            }
            .lul-infostat:nth-child(2n) {
                border-left: 1px solid rgba(57, 51, 72, 0.1);
                padding-left: 12px;
                margin-left: 12px;
            }
            .lul-infostat__label {
                font-size: 9px;
                font-weight: 600;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                line-height: 1.4;
                color: rgba(57, 51, 72, 0.8);
                white-space: nowrap;
            }
            .lul-infostat__num {
                font-size: 1.375rem;
                font-weight: 400;
                line-height: 1;
                letter-spacing: -0.03em;
                color: #594496;
                margin-top: 6px;
            }
            .lul-infostat__plus {
                font-size: 0.6em;
                margin-left: 0.15em;
                vertical-align: 0.5em;
            }

            /* ---- legend ---- */
            .lul-legend {
                position: absolute;
                bottom: 12px;
                left: 12px;
                z-index: 2;
                background: #fff;
                /* fixed so the attribution beside it can be offset by a known amount */
                width: 198px;
                box-sizing: border-box;
                padding: 12px 14px;
                border-radius: 0;
                border: 1px solid rgba(57, 51, 72, 0.12);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                pointer-events: none;
            }
            /* the head is the hit target; the body below it collapses */
            .lul-legend-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                cursor: pointer;
                user-select: none;
                /* the legend itself lets clicks through to the map — this doesn't */
                pointer-events: auto;
            }
            .lul-legend-title {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.6);
                /* the widest title is "Population covered" — the card is sized for it */
                white-space: nowrap;
            }
            .lul-legend-body {
                margin-top: 9px;
            }
            .lul-legend.is-collapsed .lul-legend-body {
                display: none;
            }
            .lul-legend-key {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 11px;
                color: rgba(57, 51, 72, 0.7);
            }
            .lul-legend-key + .lul-legend-key {
                margin-top: 7px;
            }
            /* only while the state choropleth is up — see renderLegend */
            .lul-legend-note {
                margin-top: 10px;
                padding-top: 8px;
                border-top: 1px solid rgba(57, 51, 72, 0.1);
                font-size: 10px;
                font-style: italic;
                color: rgba(57, 51, 72, 0.5);
            }
            .lul-legend-note.is-hidden {
                display: none;
            }
            .lul-legend-swatch {
                width: 13px;
                height: 13px;
                display: block;
                flex: none;
                background: rgba(57, 51, 72, 0.78);
                border: 1px solid rgba(57, 51, 72, 0.15);
            }

            /* square controls, consistent across all the maps */
            #lul-coverage-map .maplibregl-ctrl-group,
            #lul-coverage-map .maplibregl-ctrl-group button:first-child,
            #lul-coverage-map .maplibregl-ctrl-group button:last-child {
                border-radius: 0;
            }

            /* Sits with the zoom buttons rather than in the panel, because it's about
               the map as a whole and not about whatever is currently selected. */
            #lul-coverage-map .lul-national button {
                width: auto;
                height: auto;
                display: block;
                padding: 7px 10px;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.75);
                background: #fff;
                border: none;
                cursor: pointer;
                white-space: nowrap;
            }
            #lul-coverage-map .lul-national button:hover {
                background: #f2f1f0;
                color: #393348;
            }
            #lul-coverage-map .lul-national button:disabled {
                color: rgba(57, 51, 72, 0.3);
                background: #fff;
                cursor: default;
            }

            /* The attribution sits at the bottom left, just clear of the legend's 198px.
               It starts collapsed to the ⓘ (see createMap) and expands rightward into
               open map, capped so it can't run under the panel. */
            #lul-coverage-map .maplibregl-ctrl-bottom-left {
                margin-left: 210px;
            }
            #lul-coverage-map .maplibregl-ctrl-bottom-left .maplibregl-ctrl-attrib {
                max-width: 55%;
            }

            /* ---- hover tooltip that follows the cursor ---- */
            .lul-hovertip {
                position: absolute;
                z-index: 5;
                pointer-events: none;
                background: #efedec;
                color: #393348;
                border: 1px solid rgba(57, 51, 72, 0.12);
                border-left: 3px solid #c9d0a0;
                border-radius: 4px;
                padding: 6px 10px;
                font-size: 11px;
                line-height: 1.25;
                white-space: nowrap;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
                transform: translate(14px, 14px);
                opacity: 0;
                transition: opacity 0.12s ease;
            }
            .lul-hovertip.is-visible {
                opacity: 1;
            }
            .lul-hovertip b {
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                font-size: 10px;
                color: rgba(57, 51, 72, 0.55);
                display: block;
            }
            .lul-hovertip .lul-hovertip-pct {
                font-size: 15px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                margin-top: 2px;
            }
            .lul-hovertip .lul-hovertip-note {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.55);
                margin-top: 3px;
            }

            /* available / not-yet-available pill in the panel headline */
            .lul-pill {
                display: inline-block;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 5px 10px;
                background: #efedec;
                color: rgba(57, 51, 72, 0.65);
            }
            .lul-pill.is-available {
                background: #c9d0a0;
                color: #393348;
            }
            .lul-pill.is-unzoned {
                background: #e2e0de;
                color: rgba(57, 51, 72, 0.7);
            }
            /* the headline kills its line box (font-size: 0), so the gap between two
               pills has to be a margin rather than whitespace */
            .lul-pill + .lul-pill {
                margin-left: 6px;
            }

            /* ---- pinned stats panel ---- */
            .lul-statbox {
                position: absolute;
                top: 12px;
                right: 12px;
                z-index: 6;
                width: 300px;
                background: #fff;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.15);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.14);
                padding: 16px 18px 18px;
                box-sizing: border-box;
                display: none;
            }
            .lul-statbox.is-open {
                display: block;
            }
            .lul-statbox-close {
                position: absolute;
                top: 8px;
                right: 8px;
                border: none;
                background: none;
                font-size: 18px;
                line-height: 1;
                color: rgba(57, 51, 72, 0.4);
                cursor: pointer;
                padding: 4px 6px;
                font-family: inherit;
            }
            .lul-statbox-close:hover {
                color: #393348;
            }
            /* says which kind of thing the panel is about, in the header's eyebrow voice */
            .lul-statbox-kind {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.45);
                padding-right: 18px; /* clear of the close button */
                margin-bottom: 10px;
            }
            .lul-statbox-abbr {
                display: inline-block;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #393348;
                background: #e0e5c2;
                padding: 3px 8px;
                margin-bottom: 8px;
            }
            .lul-statbox-name {
                font-size: 19px;
                font-weight: 700;
                line-height: 1.15;
                margin: 0 0 10px;
                padding-right: 18px;
            }
            .lul-statbox-bar {
                height: 8px;
                background: #efedec;
                border-radius: 4px;
                overflow: hidden;
                margin-bottom: 6px;
            }
            .lul-statbox-bar i {
                display: block;
                height: 100%;
                background: #c9d0a0;
                border-radius: 4px;
                width: 0;
                transition: width 0.35s ease;
            }
            .lul-statbox-pct {
                font-size: 26px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            /* when the headline is a pill rather than a number, drop the big line box
               so the gap above it matches the gap below */
            .lul-statbox-pct.is-pill {
                font-size: 0;
            }
            .lul-statbox-pct small {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.5);
                margin-left: 6px;
            }
            .lul-statrow {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                border-top: 1px solid rgba(57, 51, 72, 0.1);
                padding: 9px 0;
                font-size: 12px;
            }
            .lul-statrow:first-of-type {
                margin-top: 14px;
            }
            .lul-statrow span {
                color: rgba(57, 51, 72, 0.6);
            }
            .lul-statrow b {
                font-size: 14px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }
            /* a button is taller than the plain values, so this row centres instead of
               sitting on the shared baseline */
            .lul-statrow--zoom {
                align-items: center;
            }
            /* the State value doubles as the way back out to that state */
            .lul-statrow-zoom {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                font-family: inherit;
                font-size: 14px;
                font-weight: 700;
                color: #393348;
                background: rgba(57, 51, 72, 0.07);
                border: none;
                border-radius: 2px;
                padding: 3px 7px;
                /* pull back out to the row's own edges so the box doesn't shift the text */
                margin: -3px -7px -3px 0;
                cursor: pointer;
                transition: background 0.2s ease;
            }
            .lul-statrow-zoom:hover {
                background: rgba(57, 51, 72, 0.14);
            }
            .lul-statrow-zoom svg {
                width: 1em;
                height: 1em;
                flex: none;
            }

            /* ---- buttons: shared system (see BUTTONS_PRIMARY_SECONDARY.html
                   and button_PRIMARY_dropdown.html) ---- */
            .lul-data-actions {
                --lul-ink: #393347; /* secondary border + label, tertiary fill */
                --lul-ink-hover: #22202b;
                --lul-primary: #594496; /* primary fill + border */
                --lul-primary-hover: #3f2e70;
                --lul-secondary-hover: #f9f9f9;
                --lul-btn-pad: 10px 26px;

                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                color: var(--lul-ink);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 18px;
                flex-wrap: wrap;
            }
            .lul-data-actions *,
            .lul-data-actions *::before,
            .lul-data-actions *::after {
                box-sizing: border-box;
            }

            /* Each dropdown passes its button's colour down to its own menu. */
            .lul-data-actions .lul-data__dropdown {
                position: relative;
                display: inline-block;
                --lul-menu-accent: var(--lul-ink);
            }
            .lul-data-actions .lul-data__dropdown:has(.lul-data__btn--primary) {
                --lul-menu-accent: var(--lul-primary);
            }

            /* Shared shell. Border is transparent here so each variant owns its own
               border-colour rather than overriding a default. */
            .lul-data-actions .lul-data__btn {
                -webkit-appearance: none;
                appearance: none;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-weight: 500;
                font-size: 1rem;
                line-height: 1.2;
                padding: var(--lul-btn-pad);
                border: 1px solid transparent;
                border-radius: 0;
                text-decoration: none;
                letter-spacing: 0.02em;
                cursor: pointer;
                transition:
                    background 0.25s ease,
                    border-color 0.25s ease,
                    color 0.25s ease,
                    gap 0.25s ease;
            }
            .lul-data-actions .lul-data__btn:hover {
                gap: 12px;
            }

            .lul-data-actions .lul-data__btn--primary {
                background: var(--lul-primary);
                border-color: var(--lul-primary);
                color: #ffffff;
            }
            .lul-data-actions .lul-data__btn--primary:hover {
                background: var(--lul-primary-hover);
                border-color: var(--lul-primary-hover);
            }

            .lul-data-actions .lul-data__btn--secondary {
                background: transparent;
                border-color: var(--lul-ink);
                color: var(--lul-ink);
            }
            .lul-data-actions .lul-data__btn--secondary:hover {
                background: var(--lul-secondary-hover);
            }

            /* filled, but in ink rather than the primary purple — a third weight for
               actions that aren't the sale and aren't quite plain either */
            .lul-data-actions .lul-data__btn--tertiary {
                background: var(--lul-ink);
                border-color: var(--lul-ink);
                color: #ffffff;
            }
            .lul-data-actions .lul-data__btn--tertiary:hover {
                background: var(--lul-ink-hover);
                border-color: var(--lul-ink-hover);
            }

            .lul-data-actions .lul-data__btn svg {
                width: 14px;
                height: 14px;
                transition: transform 0.25s ease;
            }
            .lul-data-actions .lul-data__btn:hover svg {
                transform: translateX(2px);
            }
            /* the dropdown's chevron flips instead of sliding */
            .lul-data-actions .lul-data__toggle:hover svg {
                transform: none;
            }
            .lul-data-actions .lul-data__dropdown.lul-is-open .lul-data__btn svg {
                transform: rotate(180deg);
            }

            /* Dropdown menu */
            .lul-data-actions .lul-data__menu {
                position: absolute;
                top: calc(100% - 1px); /* overlap the button's bottom border */
                left: 0;
                min-width: 100%;
                background: #ffffff;
                border: 1px solid var(--lul-menu-accent);
                z-index: 50;
                display: none;
                flex-direction: column;
            }
            .lul-data-actions .lul-data__dropdown.lul-is-open .lul-data__menu {
                display: flex;
            }
            .lul-data-actions .lul-data__option {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-weight: 500;
                font-size: 0.95rem;
                color: var(--lul-ink);
                text-decoration: none;
                white-space: nowrap;
                padding: var(--lul-btn-pad);
                border-bottom: 1px solid rgba(57, 51, 71, 0.15);
                transition:
                    background 0.2s ease,
                    color 0.2s ease;
            }
            .lul-data-actions .lul-data__option:last-child {
                border-bottom: none;
            }
            .lul-data-actions .lul-data__option:hover {
                background: var(--lul-menu-accent);
                color: #ffffff;
            }

            /* ---- state navigation: zoom to state / to one jurisdiction ---- */
            .lul-statbox-zoom {
                display: block;
                margin-top: 16px;
            }
            .lul-statbox-zoom.is-hidden,
            .lul-statbox-zoom .lul-data__dropdown.is-hidden {
                display: none;
            }
            /* flex, not block: block would drop the shell's own centring and leave the
               label and its icon ranged left */
            .lul-statbox-zoom .lul-data__btn {
                display: flex;
                width: 100%;
            }
            .lul-statbox-zoom .lul-data__dropdown {
                display: block;
                width: 100%;
            }
            /* the magnifier reads as part of the label, so it shouldn't slide on hover */
            #lul-sb-zoomstate:hover svg {
                transform: none;
            }
            .lul-statbox-zoom .lul-data__dropdown {
                margin-top: 8px;
            }
            /* The list is long, so this menu drops as a panel rather than sizing to
               the button, and scrolls internally instead of past the map edge. */
            .lul-statbox-zoom .lul-data__menu {
                max-height: 220px;
                overflow: hidden;
            }
            .lul-jz-search {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 0.8125rem;
                color: var(--lul-ink);
                border: none;
                border-bottom: 1px solid rgba(57, 51, 71, 0.15);
                padding: 9px 12px;
                width: 100%;
                box-sizing: border-box;
                outline: none;
            }
            .lul-jz-search:focus {
                border-bottom-color: var(--lul-ink);
            }
            .lul-jz-list {
                max-height: 176px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: rgba(57, 51, 72, 0.4) rgba(57, 51, 72, 0.08);
            }
            .lul-jz-item {
                display: block;
                width: 100%;
                text-align: left;
                background: none;
                border: none;
                border-bottom: 1px solid rgba(57, 51, 71, 0.08);
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 0.8125rem;
                color: var(--lul-ink);
                padding: 8px 12px;
                cursor: pointer;
                transition:
                    background 0.2s ease,
                    color 0.2s ease;
            }
            .lul-jz-item:hover {
                background: var(--lul-menu-accent);
                color: #ffffff;
            }
            /* "no matches" / "keep typing" — a message, not a choice */
            .lul-jz-note {
                font-size: 11px;
                color: rgba(57, 51, 72, 0.5);
                padding: 8px 12px;
            }

            /* ---- compact overrides: the panel is only 300px wide ---- */
            /* Buying data is a different job from reading the panel or moving around the
               map, so rule it off on both kinds of panel. */
            .lul-statbox-unlock {
                border-top: 1px solid rgba(57, 51, 72, 0.12);
                margin-top: 18px;

            }

               carries its own padding — so close the gap. */
            .lul-statbox-zoom.is-hidden + .lul-statbox-unlock {
                margin-top: 0;

            /* one smaller type scale + padding for everything inside the panel */
            .lul-statbox-unlock.lul-data-actions,
            .lul-statbox-zoom.lul-data-actions {
                --lul-btn-pad: 9px 12px;
            }
            .lul-statbox-unlock .lul-data__btn,
            .lul-statbox-zoom .lul-data__btn,
            .lul-statbox-unlock .lul-data__option {
                font-size: 0.8125rem;

            .lul-statbox-unlock .lul-data__btn:hover,
            .lul-statbox-zoom .lul-data__btn:hover {

            }
            .lul-statbox-unlock .lul-data__btn svg,
            .lul-statbox-zoom .lul-data__btn svg {
                width: 12px;
                height: 12px;
            }
            .lul-statbox-unlock .lul-data__option {

            }

            /* only speaks up when there's no data to sell for this geography */
            .lul-statbox-prompt {
                font-size: 11px;
                line-height: 1.35;
                color: rgba(57, 51, 72, 0.7);
                margin: 12px 0 0;
            }
            .lul-statbox-prompt:empty {
                display: none;
            }

            /* nothing to buy for a jurisdiction that isn't available yet */
            .lul-data-actions .lul-data__btn.is-disabled,
            .lul-data-actions .lul-data__btn.is-disabled:hover {
                pointer-events: none;
                cursor: default;
                background: #efedec;
                border-color: rgba(57, 51, 72, 0.12);

                gap: 7px;
            }

            /* ---- status / error ---- */
            /* centred along the top: the info card owns the left corner now */
            .lul-status {
                position: absolute;
                top: 12px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 6;
                background: #fff;
                border: 1px solid rgba(57, 51, 72, 0.15);
                border-left: 3px solid #c9d0a0;
                border-radius: 4px;
                padding: 10px 14px;

            }
            .lul-status.is-hidden {

            @media (max-width: 700px) {
                /* both overlays start folded here, so they need far less headroom */
                .lul-coverage {
                    min-height: 320px;
                }
                /* Keeps its width and docks to the bottom; only once the viewport is
                   narrower than the panel does it start giving width back. */
                .lul-statbox {

                    bottom: 12px;
                    width: 300px;

                   The legend keeps its 198px so the attribution offset still clears it. */
                .lul-infocard {
                    max-width: calc(100% - 24px);
                }
            }
        </style>
