        <script>
            (function () {
                "use strict";

                // Live status for every jurisdiction. The local file is a snapshot fallback
                // for when the API can't be reached; the API is the source of truth.
                var JURISDICTIONS_API = "https://api.zoningatlas.org/atlas_jurisdictions";
                var JURISDICTIONS_SNAPSHOT = "data/atlas_jurisdictions.json";

                // Geometry, built by build_coverage_data.py. Rerun that when boundaries change.
                var STATES_GEOJSON = "data/states.geojson";
                var JURISDICTION_TILES = "pmtiles://data/jurisdictions.pmtiles";
                // One label anchor per jurisdiction, so multi-part ones aren't named twice.
                var JURISDICTION_LABEL_TILES = "pmtiles://data/jurisdiction_labels.pmtiles";

                // National rollup behind the info card's four stats. Same endpoint and
                // same figures as coverage-stats.html, so the two never disagree.
                var COVERAGE_API = "https://api.zoningatlas.org/nza_coverage";

                // label + where the number comes from. `field` reads the API row;
                // `fallback` stands in when the fetch fails. dp = decimal places on the
                // abbreviated number, unit forces K/M/B instead of picking by magnitude.
                var INFO_STATS = [
                    { label: "parcels", fallback: 90000000, dp: 0, unit: "M" },
                    { label: "acres", field: "acres_covered", fallback: 1424905646, dp: 1 },
                    { label: "residents", field: "population_covered", fallback: 225165866, dp: 0 },
                    { label: "zoning pages", field: "pages_analyzed", fallback: 1343115, dp: 1 },
                ];

                // Bounding box per jurisdiction, {id: [w, s, e, n]}, built by
                // build_coverage_data.py. Fetched lazily, only once someone opens the
                // jurisdiction picker, since it's a couple of MB nobody else needs.
                var JURISDICTION_BOUNDS = "data/jurisdiction_bounds.json";

                // Basemaps. Switch by changing BASEMAP. Each entry names the schema-specific
                // bits our own layers need to agree with: which source-layers to strip, and a
                // font the style's glyph endpoint actually serves.
                var BASEMAPS = {
                    nza: {
                        style: "https://nzabasemap.blob.core.windows.net/nzabasemap/map_style_2025_11_03.json",
                        // The published style still points at the dead tiles.zoningatlas1.org
                        // host; rewrite the source to the working one at load time. Harmless
                        // once the style itself is corrected.
                        tiles: "https://tiles.zoningatlas.org/nza_merged",
                        staleTileHost: "tiles.zoningatlas1.org",
                        // protomaps schema
                        drop: ["roads", "transit_stations"],
                        font: "Montserrat SemiBold",
                        attribution: "Basemap: National Zoning Atlas",
                    },
                    carto: {
                        style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
                        // openmaptiles schema
                        drop: ["transportation", "transportation_name", "aeroway", "building", "housenumber", "poi"],
                        font: "Open Sans Bold",
                        attribution: "Boundaries: Land Use Labs",
                    },
                };
                var BASEMAP = BASEMAPS.nza;

                // Zoom at which the state choropleth hands off to individual jurisdictions.
                var SWAP_ZOOM = 5.5;

                // How many zoom levels the handoff is spread over. Bigger = softer, more
                // gradual fade; 0 = hard cut with no fade at all. Applies to both sides:
                // states fade out over [SWAP_ZOOM - FADE, SWAP_ZOOM], jurisdictions fade
                // in over [SWAP_ZOOM, SWAP_ZOOM + FADE].
                var FADE = 0.5;

                // Opacity each layer fades to/from at the handoff. Raise these toward the
                // full values to keep more color through the transition.
                var STATE_FADE_TO = 0.7;
                var JURISDICTION_FADE_FROM = 0.5;

                // Hover keeps a feature's own fill and just leans on the opacity, so the
                // colour never shifts out of the legend's scale.
                var HOVER_OPACITY_BUMP = 0.18;

                // States are shaded by the share of their population we cover, so a state
                // that's 4% done doesn't read the same as one that's finished. Tints of
                // the brand purple; 0% falls through to the no-data grey.
                var STATE_STEPS = [
                    { min: 1, color: "#BAB8BF", label: "1–25%" },
                    { min: 26, color: "#928F9A", label: "26–50%" },
                    { min: 51, color: "#6B6676", label: "51–75%" },
                    { min: 76, color: "#393348", label: "76–100%" },
                ];

                var COVERED_FILL = "#393348";
                var NO_DATA_FILL = "#EFEDEC"; // states we have nothing for
                var UNAVAILABLE_FILL = "#D2D0CE"; // jurisdictions we can't offer data for yet
                var ACCENT = "#C9D0A0";

                // Continental US. The state file also carries AK, HI and the territories,
                // so fitting everything would zoom out past the lower 48.
                var CONUS_BOUNDS = [
                    [-125.2, 24.2],
                    [-66.7, 49.6],
                ];

                var el = function (id) {
                    return document.getElementById(id);
                };
                var fmt = function (n) {
                    return typeof n === "number" ? n.toLocaleString("en-US") : "—";
                };
                // Jurisdiction names come from the API and go into innerHTML.
                var esc = function (s) {
                    return String(s).replace(/[&<>"]/g, function (c) {
                        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
                    });
                };

                // ---------- info card ----------
                // Number formatting lifted from coverage-stats.html so the figures read
                // identically in both places: K/M/B by magnitude unless forced, anything
                // under 100,000 with commas, and a smaller trailing "+".
                function roundDp(x, dp) {
                    if (dp === 0) return String(Math.round(x));
                    return (Math.round(x * 10) / 10).toFixed(1).replace(/\.0$/, "");
                }

                function abbr(n, dp, unit) {
                    if (dp == null) dp = 1;
                    var a = Math.abs(n);
                    if (unit === "B" || (!unit && a >= 1e9)) return roundDp(n / 1e9, dp) + "B";
                    if (unit === "M" || (!unit && a >= 1e6)) return roundDp(n / 1e6, dp) + "M";
                    if (unit === "K" || (!unit && a > 99999)) return roundDp(n / 1e3, dp) + "K";
                    return Math.round(n).toLocaleString("en-US");
                }

                function renderInfoStats(row) {
                    el("lul-infostats").innerHTML = INFO_STATS.map(function (s) {
                        var v = row && s.field && typeof row[s.field] === "number" ? row[s.field] : s.fallback;
                        return (
                            '<div class="lul-infostat"><div class="lul-infostat__label">' +
                            s.label +
                            '</div><div class="lul-infostat__num">' +
                            abbr(v, s.dp, s.unit) +
                            '<span class="lul-infostat__plus">+</span></div></div>'
                        );
                    }).join("");
                }

                // Draw the fallbacks straight away so the card is never empty, then
                // correct them once the API answers.
                function loadInfoStats() {
                    renderInfoStats(null);
                    fetch(COVERAGE_API, { headers: { Accept: "application/json" } })
                        .then(function (r) {
                            if (!r.ok) throw new Error("HTTP " + r.status);
                            return r.json();
                        })
                        .then(function (data) {
                            renderInfoStats(Array.isArray(data) ? data[0] : data);
                        })
                        .catch(function (err) {
                            console.warn("Coverage stats unavailable, showing fallbacks:", err);
                        });
                }

                // The two map overlays fold up to their headers. Open by default on a
                // wide map, folded on a narrow one where they'd cover most of it —
                // reapplied whenever the viewport crosses that breakpoint, so a manual
                // toggle lasts until the layout itself changes.
                function wireCollapsibles() {
                    var card = document.querySelector(".lul-infocard");
                    var legend = document.querySelector(".lul-legend");
                    var narrow = window.matchMedia("(max-width: 700px)");

                    function applyDefault(mq) {
                        card.classList.toggle("is-collapsed", mq.matches);
                        legend.classList.toggle("is-collapsed", mq.matches);
                    }
                    applyDefault(narrow);
                    if (narrow.addEventListener) narrow.addEventListener("change", applyDefault);

                    el("lul-infocard-toggle").addEventListener("click", function () {
                        card.classList.toggle("is-collapsed");
                    });
                    // the whole header is the target, not just the caret
                    el("lul-legend-head").addEventListener("click", function () {
                        legend.classList.toggle("is-collapsed");
                    });
                }

                // ---------- map ----------
                // maplibre-gl v4 wants the promise-based handler (tilev4). The plain
                // `.tile` is a callback-style shim for maplibre v2/v3 and never resolves here.
                var pmtilesProtocol = new pmtiles.Protocol();
                maplibregl.addProtocol("pmtiles", pmtilesProtocol.tilev4 || pmtilesProtocol.tile);

                var map;

                // Fetch the style so the stale tile host baked into it can be corrected
                // before MapLibre ever sees it. Falls back to the plain URL if that fails.
                function resolveStyle() {
                    if (!BASEMAP.staleTileHost) return Promise.resolve(BASEMAP.style);
                    return fetch(BASEMAP.style)
                        .then(function (r) {
                            if (!r.ok) throw new Error("style HTTP " + r.status);
                            return r.json();
                        })
                        .then(function (style) {
                            Object.keys(style.sources || {}).forEach(function (key) {
                                var src = style.sources[key];
                                if (src.url && src.url.indexOf(BASEMAP.staleTileHost) !== -1) {
                                    src.url = BASEMAP.tiles;
                                }
                            });
                            return style;
                        })
                        .catch(function (err) {
                            console.warn("Could not patch basemap style, using it as-is:", err);
                            return BASEMAP.style;
                        });
                }

                // Map-level control: frames the lower 48 again from wherever you are.
                // Greys out once you're already there, and comes back when you move off.
                var nationalViewControl = {
                    button: null,
                    onAdd: function () {
                        var wrap = document.createElement("div");
                        wrap.className = "maplibregl-ctrl maplibregl-ctrl-group lul-national";
                        var btn = document.createElement("button");
                        btn.type = "button";
                        btn.textContent = "Zoom to National View";
                        btn.addEventListener("click", function () {
                            fitToContinentalUS(true);
                        });
                        wrap.appendChild(btn);
                        this.button = btn;
                        this.container = wrap;
                        return wrap;
                    },
                    onRemove: function () {
                        this.container.parentNode.removeChild(this.container);
                        this.button = null;
                    },
                };

                function createMap(style) {
                    map = new maplibregl.Map({
                        container: "lul-coverage-map",
                        style: style,
                        center: [-98.5, 39.5],
                        zoom: 3.6,
                        minZoom: 2,
                        maxZoom: 13,
                        attributionControl: false,
                        dragRotate: false,
                        pitchWithRotate: false,
                        touchZoomRotate: true,
                    });
                    map.touchZoomRotate.disableRotation();
                    // Credits live over by the legend, out of the way of the controls.
                    map.addControl(
                        new maplibregl.AttributionControl({
                            compact: true,
                            customAttribution: BASEMAP.attribution,
                        }),
                        "bottom-left",
                    );
                    // The bottom corners lay their controls out bottom-up, so the one
                    // added first sits lowest: national view underneath, zoom above it.
                    map.addControl(nationalViewControl, "bottom-right");
                    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

                    // Start the attribution collapsed to the ⓘ so its text doesn't run
                    // across the bottom of the map. Click still reveals the credits.
                    var attrib = map.getContainer().querySelector(".maplibregl-ctrl-attrib");
                    if (attrib) attrib.classList.remove("maplibregl-compact-show");

                    // No resize handling needed here: trackResize (on by default) already
                    // puts a debounced ResizeObserver on the container, which covers the
                    // header rewrapping. A second one fights it and flashes the canvas.

                    map.on("error", function (e) {
                        console.error("map error:", e && e.error ? e.error.message : e);
                    });
                    return map;
                }

                var status = el("lul-status");
                function setStatus(msg, isError) {
                    if (!msg) {
                        status.classList.add("is-hidden");
                        return;
                    }
                    status.classList.remove("is-hidden");
                    status.classList.toggle("is-error", !!isError);
                    status.textContent = msg;
                }

                // ---------- data ----------
                var jurisdictionById = {}; // id -> API record
                var stateStats = {}; // state_id -> { covered, population, coveredPopulation, name }
                var jurisdictionsByState = {}; // state_id -> [{ id, name }], sorted by name
                var stateBounds = {}; // state_id -> LngLatBounds, off the geometry we load
                var stateProps = {}; // state_id -> the joined feature properties
                var zoomStateId = null; // state the open panel is for, if it's a state
                var zoomOutStateId = null; // its parent state, if the panel is a jurisdiction
                var openStateAbbr = ""; // postcode of the last state panel opened
                var jurisdictionBounds = null; // id -> [w, s, e, n], lazily fetched
                var boundsRequest = null; // in-flight/settled fetch of the above
                var boundsFailed = false;

                function loadJurisdictionBounds() {
                    if (boundsRequest) return boundsRequest;
                    boundsRequest = fetch(JURISDICTION_BOUNDS)
                        .then(function (r) {
                            if (!r.ok) throw new Error("HTTP " + r.status);
                            return r.json();
                        })
                        .then(function (data) {
                            jurisdictionBounds = data;
                        })
                        .catch(function (err) {
                            // Generated by build_coverage_data.py; without it there's
                            // nowhere to fly, so the picker says so rather than going dead.
                            console.warn("Jurisdiction bounds unavailable:", err);
                            boundsFailed = true;
                        });
                    return boundsRequest;
                }

                // The only distinction the map draws: have we published this jurisdiction?
                // One that turned out to have no zoning still counts — it's covered
                // ground, and the panel tags it as unzoned rather than hiding it in with
                // the unpublished.
                function isAvailable(rec) {
                    return !!(rec && rec.published);
                }

                // has_zoning is null for jurisdictions nobody has looked at yet, which are
                // unpublished anyway, so this only ever speaks about published ones.
                function isUnzoned(rec) {
                    return !!(rec && rec.published && !rec.has_zoning);
                }

                // Coverage is measured by population, not by counting jurisdictions:
                // a state whose big cities are done is far more complete than a state
                // with the same number of small towns finished.
                //
                // Its basis is `published` alone — a jurisdiction we've published that
                // turned out to have no zoning is still ground we've covered, and this
                // has to agree with the national coverage figures. That's a wider net
                // than isAvailable(), which is about what we can hand over.
                function indexJurisdictions(rows) {
                    rows.forEach(function (r) {
                        jurisdictionById[r.id] = r;

                        var s = stateStats[r.state_id];
                        if (!s) {
                            s = stateStats[r.state_id] = {
                                covered: 0,
                                population: 0,
                                coveredPopulation: 0,
                                name: r.state_name,
                            };
                        }
                        var pop = r.population || 0;
                        s.population += pop;
                        if (r.published) {
                            s.covered += 1;
                            s.coveredPopulation += pop;
                        }

                        (jurisdictionsByState[r.state_id] || (jurisdictionsByState[r.state_id] = [])).push({
                            id: r.id,
                            name: r.name,
                        });
                    });

                    Object.keys(jurisdictionsByState).forEach(function (sid) {
                        jurisdictionsByState[sid].sort(function (a, b) {
                            return a.name.localeCompare(b.name);
                        });
                    });
                }

                // Stamp the per-state rollups onto the state polygons so the paint
                // expressions can read them straight off the feature.
                function joinStates(geojson) {
                    geojson.features.forEach(function (f) {
                        var s = stateStats[f.properties.id];
                        var population = s ? s.population : 0;
                        var covered = s ? s.coveredPopulation : 0;
                        f.properties.population = population;
                        f.properties.covered_population = covered;
                        f.properties.percentage = population ? Math.round((covered / population) * 100) : -1;
                        // 0% counts as no coverage, same grey as a state we have nothing for.
                        f.properties.isCovered = covered > 0;
                    });
                    return geojson;
                }

                // Extent and joined properties per state: the bounds for the zoom
                // controls, the properties for rebuilding a state panel without a click
                // on the map. Taken off the geometry the choropleth already draws.
                function indexStates(geojson) {
                    geojson.features.forEach(function (f) {
                        var b = new maplibregl.LngLatBounds();
                        var walk = function (c) {
                            if (typeof c[0] === "number") {
                                b.extend(c);
                                return;
                            }
                            c.forEach(walk);
                        };
                        walk(f.geometry.coordinates);
                        stateBounds[f.properties.id] = b;
                        stateProps[f.properties.id] = f.properties;
                    });
                }

                // MapLibre places a symbol on every part of a MultiPolygon, so states with
                // islands get their abbreviation several times. Label off a single point per
                // state instead: the centroid of its largest polygon.
                function labelPoints(geojson) {
                    function ringArea(r) {
                        var a = 0;
                        for (var i = 0; i < r.length - 1; i++) {
                            a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
                        }
                        return a / 2;
                    }
                    function ringCentroid(r) {
                        var a = ringArea(r),
                            cx = 0,
                            cy = 0;
                        if (!a) return null;
                        for (var i = 0; i < r.length - 1; i++) {
                            var f = r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
                            cx += (r[i][0] + r[i + 1][0]) * f;
                            cy += (r[i][1] + r[i + 1][1]) * f;
                        }
                        return [cx / (6 * a), cy / (6 * a)];
                    }
                    return {
                        type: "FeatureCollection",
                        features: geojson.features
                            .map(function (f) {
                                var polys =
                                    f.geometry.type === "MultiPolygon"
                                        ? f.geometry.coordinates
                                        : [f.geometry.coordinates];
                                var biggest = polys.reduce(function (best, p) {
                                    return !best || Math.abs(ringArea(p[0])) > Math.abs(ringArea(best[0])) ? p : best;
                                }, null);
                                var pt = biggest && ringCentroid(biggest[0]);
                                if (!pt) return null;
                                return {
                                    type: "Feature",
                                    properties: f.properties,
                                    geometry: { type: "Point", coordinates: pt },
                                };
                            })
                            .filter(Boolean),
                    };
                }

                // Drop the road network and every basemap label: our own vector layers
                // already name the states and jurisdictions.
                function simplifyBasemap() {
                    (map.getStyle().layers || []).forEach(function (layer) {
                        if (layer.type === "symbol" || BASEMAP.drop.indexOf(layer["source-layer"]) !== -1) {
                            map.removeLayer(layer.id);
                        }
                    });
                }

                // Keep our fills beneath the basemap's own labels so place names read through.
                function firstSymbolLayerId() {
                    var layers = map.getStyle().layers || [];
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].type === "symbol") return layers[i].id;
                    }
                    return undefined;
                }

                // ["step", percentage, <below first stop>, 1, tint1, 26, tint2, ...]
                function stateStepExpression() {
                    var expr = ["step", ["get", "percentage"], NO_DATA_FILL];
                    STATE_STEPS.forEach(function (s) {
                        expr.push(s.min, s.color);
                    });
                    return expr;
                }

                // Zoom-driven opacity ramp, nudged up while a feature is hovered and, if
                // asked, held at full while it stays selected.
                // The ["zoom"] interpolate has to stay the outermost expression —
                // MapLibre rejects a zoom expression nested inside a "case", so the
                // state tests go in each stop's output instead of wrapping the ramp.
                function hoverableOpacity(stops, holdSelected) {
                    var expr = ["interpolate", ["linear"], ["zoom"]];
                    stops.forEach(function (s) {
                        var hovered = Math.min(1, s[1] + HOVER_OPACITY_BUMP);
                        var out = ["case"];
                        if (holdSelected) {
                            out.push(["boolean", ["feature-state", "selected"], false], 1);
                        }
                        out.push(["boolean", ["feature-state", "hover"], false], hovered, s[1]);
                        expr.push(s[0], out);
                    });
                    return expr;
                }

                // ---------- layers ----------
                function addStateLayers(geojson, beforeId) {
                    map.addSource("states", { type: "geojson", data: geojson, promoteId: "id" });

                    map.addLayer(
                        {
                            id: "states-fill",
                            type: "fill",
                            source: "states",
                            maxzoom: SWAP_ZOOM,
                            paint: {
                                "fill-color": [
                                    "case",
                                    ["==", ["get", "isCovered"], false],
                                    NO_DATA_FILL,
                                    stateStepExpression(),
                                ],
                                // ease off approaching the handoff to jurisdictions
                                "fill-opacity": hoverableOpacity([
                                    [SWAP_ZOOM - FADE, 0.78],
                                    [SWAP_ZOOM, STATE_FADE_TO],
                                ]),
                            },
                        },
                        beforeId,
                    );

                    map.addLayer(
                        {
                            id: "states-line",
                            type: "line",
                            source: "states",
                            maxzoom: SWAP_ZOOM,
                            paint: {
                                "line-color": "rgba(255,255,255,0.9)",
                                "line-width": 0.9,
                            },
                        },
                        beforeId,
                    );

                    map.addSource("state-labels", { type: "geojson", data: labelPoints(geojson) });
                    map.addLayer({
                        id: "states-label",
                        type: "symbol",
                        source: "state-labels",
                        minzoom: 3,
                        maxzoom: SWAP_ZOOM,
                        layout: {
                            "text-field": ["get", "postcode"],
                            "text-font": [BASEMAP.font],
                            "text-size": 11,
                            "text-letter-spacing": 0.08,
                            "text-allow-overlap": false,
                            "text-padding": 3,
                        },
                        paint: {
                            // the two lighter tints need dark type; the two darker ones need white
                            "text-color": ["case", [">=", ["get", "percentage"], 51], "#FFFFFF", "rgba(57,51,72,0.75)"],
                            "text-halo-color": [
                                "case",
                                [">=", ["get", "percentage"], 51],
                                "rgba(57,51,72,0.45)",
                                "rgba(255,255,255,0.9)",
                            ],
                            "text-halo-width": 1,
                        },
                    });
                }

                // The accent outline of whichever state the panel is about. Its own layer,
                // with no maxzoom, so it survives the handoff to jurisdictions — down
                // among them it's the only thing still saying which state you're in.
                // Added after the jurisdiction fills, or it would be painted over by
                // them: layers sharing a beforeId stack in the order they're added.
                // Driven by a `focus` state rather than `selected`, since it stays lit
                // while a jurisdiction inside it is the selected feature.
                function addStateFocusLayer(beforeId) {
                    map.addLayer(
                        {
                            id: "states-focus-line",
                            type: "line",
                            source: "states",
                            paint: {
                                "line-color": ACCENT,
                                // a touch heavier once you're in among the jurisdictions,
                                // where only a short stretch of the border is on screen
                                "line-width": ["interpolate", ["linear"], ["zoom"], 4, 2.5, 8, 3.5],
                                "line-opacity": ["case", ["boolean", ["feature-state", "focus"], false], 1, 0],
                            },
                        },
                        beforeId,
                    );
                }

                function addJurisdictionLayers(beforeId) {
                    map.addSource("jurisdictions", {
                        type: "vector",
                        url: JURISDICTION_TILES,
                        promoteId: { jurisdictions: "id" },
                    });

                    map.addLayer(
                        {
                            id: "jurisdictions-fill",
                            type: "fill",
                            source: "jurisdictions",
                            "source-layer": "jurisdictions",
                            minzoom: SWAP_ZOOM,
                            paint: {
                                "fill-color": [
                                    "case",
                                    ["boolean", ["feature-state", "available"], false],
                                    COVERED_FILL,
                                    UNAVAILABLE_FILL,
                                ],
                                // fade in as the state fills drop away; a selected
                                // jurisdiction holds full opacity under its accent outline
                                "fill-opacity": hoverableOpacity(
                                    [
                                        [SWAP_ZOOM, JURISDICTION_FADE_FROM],
                                        [SWAP_ZOOM + FADE, 0.8],
                                    ],
                                    true,
                                ),
                            },
                        },
                        beforeId,
                    );

                    map.addLayer(
                        {
                            id: "jurisdictions-line",
                            type: "line",
                            source: "jurisdictions",
                            "source-layer": "jurisdictions",
                            minzoom: SWAP_ZOOM,
                            paint: {
                                "line-color": [
                                    "case",
                                    ["boolean", ["feature-state", "selected"], false],
                                    ACCENT,
                                    "rgba(255,255,255,0.75)",
                                ],
                                "line-width": ["case", ["boolean", ["feature-state", "selected"], false], 2.5, 0.5],
                                "line-opacity": [
                                    "interpolate",
                                    ["linear"],
                                    ["zoom"],
                                    SWAP_ZOOM,
                                    0.35,
                                    SWAP_ZOOM + FADE,
                                    1,
                                ],
                            },
                        },
                        beforeId,
                    );

                    map.addSource("jurisdiction-labels", {
                        type: "vector",
                        url: JURISDICTION_LABEL_TILES,
                        promoteId: { jurisdiction_labels: "id" },
                    });
                    map.addLayer({
                        id: "jurisdictions-label",
                        type: "symbol",
                        source: "jurisdiction-labels",
                        "source-layer": "jurisdiction_labels",
                        minzoom: 8.5,
                        layout: {
                            "text-field": ["get", "name"],
                            "text-font": [BASEMAP.font],
                            "text-size": 11,
                            "text-allow-overlap": false,
                            "text-padding": 4,
                        },
                        paint: {
                            "text-color": [
                                "case",
                                ["boolean", ["feature-state", "available"], false],
                                "#FFFFFF",
                                "rgba(57,51,72,0.75)",
                            ],
                            "text-halo-color": [
                                "case",
                                ["boolean", ["feature-state", "available"], false],
                                "rgba(57,51,72,0.5)",
                                "rgba(255,255,255,0.9)",
                            ],
                            "text-halo-width": 1,
                        },
                    });
                }

                // Availability lives in the API, not the tiles, so it's applied as feature
                // state. MapLibre keeps this keyed by id and reapplies it to each tile as
                // it loads, so it's safe to set before any tile has arrived. Feature state
                // is per-source, so the label tiles need it too or every label would fall
                // through to the unavailable styling.
                function applyAvailableState() {
                    var targets = [
                        { source: "jurisdictions", sourceLayer: "jurisdictions" },
                        { source: "jurisdiction-labels", sourceLayer: "jurisdiction_labels" },
                    ];
                    var n = 0;
                    Object.keys(jurisdictionById).forEach(function (id) {
                        if (!isAvailable(jurisdictionById[id])) return;
                        targets.forEach(function (t) {
                            map.setFeatureState(
                                { source: t.source, sourceLayer: t.sourceLayer, id: Number(id) },
                                { available: true },
                            );
                        });
                        n++;
                    });
                    return n;
                }

                // Animated only when the user asks for it; the first fit happens before
                // anyone is looking.
                function fitToContinentalUS(animated) {
                    map.fitBounds(CONUS_BOUNDS, {
                        padding: fitPadding(),
                        duration: animated ? 900 : 0,
                    });
                }

                // ---------- interaction ----------
                var hovered = null; // { source, sourceLayer, id }
                var selected = null;
                var tip = el("lul-hovertip");
                var statbox = el("lul-statbox");
                var mapEl = el("lul-coverage-map");

                function sameFeature(a, b) {
                    return a && b && a.source === b.source && a.id === b.id;
                }

                function setHover(target) {
                    if (sameFeature(hovered, target)) return;
                    if (hovered) map.setFeatureState(hovered, { hover: false });
                    hovered = target;
                    if (hovered) map.setFeatureState(hovered, { hover: true });
                }

                function setSelected(target) {
                    if (selected) map.setFeatureState(selected, { selected: false });
                    selected = target;
                    if (selected) map.setFeatureState(selected, { selected: true });
                }

                // Which state's outline stays lit: the selected state, or the one holding
                // the selected jurisdiction.
                var focusedStateId = null;
                function setFocusState(stateId) {
                    var next = stateId == null ? null : Number(stateId);
                    if (next === focusedStateId) return;
                    if (focusedStateId != null) {
                        map.setFeatureState({ source: "states", id: focusedStateId }, { focus: false });
                    }
                    focusedStateId = next;
                    if (focusedStateId != null) {
                        map.setFeatureState({ source: "states", id: focusedStateId }, { focus: true });
                    }
                }

                function showTip(html, point) {
                    tip.innerHTML = html;
                    tip.classList.add("is-visible");
                    positionTip(point);
                }

                function positionTip(point) {
                    var w = tip.offsetWidth,
                        h = tip.offsetHeight;
                    tip.style.transform =
                        "translate(" +
                        (point.x + w + 24 > mapEl.clientWidth ? -w - 14 : 14) +
                        "px, " +
                        (point.y + h + 24 > mapEl.clientHeight ? -h - 14 : 14) +
                        "px)";
                    tip.style.left = point.x + "px";
                    tip.style.top = point.y + "px";
                }

                function hideTip() {
                    tip.classList.remove("is-visible");
                }

                function row(label, value) {
                    return '<div class="lul-statrow"><span>' + label + "</span><b>" + value + "</b></div>";
                }

                // Same row, but the value is the way back out to that state.
                function stateRow(name, stateId) {
                    return (
                        '<div class="lul-statrow lul-statrow--zoom"><span>State</span>' +
                        '<button type="button" class="lul-statrow-zoom" data-state="' +
                        stateId +
                        '" title="Zoom to ' +
                        esc(name) +
                        '">' +
                        '<svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
                        '<circle cx="9" cy="9" r="5.25" stroke="currentColor" stroke-width="2"/>' +
                        '<path d="M6.75 9h4.5M13 13l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
                        "</svg>" +
                        esc(name) +
                        "</button></div>"
                    );
                }

                var UNAVAILABLE_NOTE = "This data isn't available yet. Check back soon.";

                // Both panel dropdowns behave the same way: the toggle opens its own menu
                // and closes the other, and a click anywhere else closes both.
                var DROPDOWNS = [
                    { menu: "lul-sb-dropdown", toggle: "lul-sb-unlock" },
                    { menu: "lul-sb-jzdropdown", toggle: "lul-sb-jztoggle" },
                ];

                function closeDropdown() {
                    DROPDOWNS.forEach(function (d) {
                        el(d.menu).classList.remove("lul-is-open");
                    });
                }

                function wireDropdown() {
                    DROPDOWNS.forEach(function (d) {
                        var dd = el(d.menu);
                        el(d.toggle).addEventListener("click", function (e) {
                            e.preventDefault();
                            e.stopPropagation();
                            var open = dd.classList.contains("lul-is-open");
                            closeDropdown();
                            if (!open) {
                                dd.classList.add("lul-is-open");
                                if (d.menu === "lul-sb-jzdropdown") el("lul-sb-jzsearch").focus();
                            }
                        });
                    });
                    document.addEventListener("click", function (e) {
                        var inside = DROPDOWNS.some(function (d) {
                            return el(d.menu).contains(e.target);
                        });
                        if (!inside) closeDropdown();
                    });
                }

                function openBox(opts) {
                    el("lul-sb-kind").textContent = opts.kind || "";
                    var abbr = el("lul-sb-abbr");
                    abbr.textContent = opts.abbr || "";
                    abbr.style.display = opts.abbr ? "inline-block" : "none";
                    el("lul-sb-name").textContent = opts.name;
                    var headline = el("lul-sb-headline");
                    headline.innerHTML = opts.headline;
                    headline.classList.toggle("is-pill", !!opts.pill);
                    el("lul-sb-barwrap").style.display = opts.bar == null ? "none" : "block";
                    if (opts.bar != null) el("lul-sb-bar").style.width = opts.bar + "%";
                    el("lul-sb-rows").innerHTML = opts.rows;

                    var unavailable = !!opts.unavailable;

                    // nothing to unlock for a jurisdiction we can't offer data for yet
                    closeDropdown();
                    el("lul-sb-unlock").classList.toggle("is-disabled", unavailable);
                    el("lul-sb-prompt").textContent = unavailable ? UNAVAILABLE_NOTE : "";

                    showZoomControls(opts);

                    statbox.classList.add("is-open");
                }

                function closeBox() {
                    closeDropdown();
                    statbox.classList.remove("is-open");
                    setSelected(null);
                    setFocusState(null);
                }

                // ---------- zooming ----------
                // Even padding, so whatever we fly to lands in the middle of the map.
                // The panel overlaps the right edge, but reserving room for it threw
                // everything off-centre, which reads worse than the overlap.
                function fitPadding(extra) {
                    return 30 + (extra || 0);
                }

                function zoomToStateBounds(stateId) {
                    var b = stateBounds[stateId];
                    if (b) map.fitBounds(b, { padding: fitPadding(), duration: 900 });
                }

                // The State row on a jurisdiction panel: hand the panel back to that
                // state and re-select it, then frame it. Worth doing even when the camera
                // is already on the state — the point is the panel, not just the camera.
                function backToState(stateId) {
                    var props = stateProps[stateId];
                    if (!props) return;
                    setSelected({ source: "states", id: Number(stateId) });
                    openStateBox(props);
                    zoomToStateBounds(stateId);
                }

                // A button that would land you exactly where you already are has nothing
                // to do, so it greys out until the map moves off that framing.
                function cameraFor(bounds) {
                    return bounds ? map.cameraForBounds(bounds, { padding: fitPadding() }) : null;
                }

                function atCamera(cam) {
                    if (!cam) return false;
                    if (Math.abs(map.getZoom() - cam.zoom) > 0.05) return false;
                    // compare on screen, so the tolerance means the same thing at every zoom
                    var target = map.project(maplibregl.LngLat.convert(cam.center));
                    var here = map.project(map.getCenter());
                    return Math.abs(target.x - here.x) < 6 && Math.abs(target.y - here.y) < 6;
                }

                // No is-open guard: openBox sets the panel's state before it opens it,
                // and when the panel is closed these buttons aren't on screen anyway.
                function updateZoomButtons() {
                    el("lul-sb-zoomstate").classList.toggle(
                        "is-disabled",
                        zoomStateId != null && atCamera(cameraFor(stateBounds[zoomStateId])),
                    );
                    if (nationalViewControl.button) {
                        nationalViewControl.button.disabled = atCamera(cameraFor(CONUS_BOUNDS));
                    }
                }

                // Goes through the loader so a pick made before the bounds file lands
                // still flies once it does.
                function zoomToJurisdiction(id) {
                    loadJurisdictionBounds().then(function () {
                        var b = jurisdictionBounds && jurisdictionBounds[id];
                        if (!b) return;
                        map.fitBounds(
                            [
                                [b[0], b[1]],
                                [b[2], b[3]],
                            ],
                            // Sit back from the boundary rather than filling the frame
                            // with it: the neighbours are the context. maxZoom keeps a
                            // small jurisdiction from flying past what the tiles carry.
                            { padding: fitPadding(40), maxZoom: 10.5, duration: 900 },
                        );
                    });
                }

                // Picking from the list does what clicking the polygon does — swaps the
                // panel over to that jurisdiction — and then flies there.
                function selectJurisdiction(id) {
                    var rec = jurisdictionById[id];
                    if (!rec) return;
                    closeDropdown();
                    setSelected({ source: "jurisdictions", sourceLayer: "jurisdictions", id: Number(id) });
                    openJurisdictionBox({ id: Number(id), name: rec.name, st: openStateAbbr });
                    zoomToJurisdiction(id);
                }

                // Long lists are the norm — Pennsylvania alone has ~2,500 — so render a
                // slice and let the search box do the narrowing.
                var JZ_LIMIT = 200;

                function renderJurisdictionList() {
                    var list = el("lul-sb-jzlist");
                    var all = jurisdictionsByState[zoomStateId] || [];
                    var q = el("lul-sb-jzsearch").value.trim().toLowerCase();
                    var matches = q
                        ? all.filter(function (j) {
                              return j.name.toLowerCase().indexOf(q) !== -1;
                          })
                        : all;

                    if (!matches.length) {
                        list.innerHTML = '<div class="lul-jz-note">No jurisdictions match.</div>';
                        return;
                    }
                    var html = matches
                        .slice(0, JZ_LIMIT)
                        .map(function (j) {
                            return (
                                '<button type="button" class="lul-jz-item" data-id="' +
                                j.id +
                                '">' +
                                esc(j.name) +
                                "</button>"
                            );
                        })
                        .join("");
                    if (matches.length > JZ_LIMIT) {
                        html +=
                            '<div class="lul-jz-note">' +
                            fmt(matches.length - JZ_LIMIT) +
                            " more — keep typing to narrow.</div>";
                    }
                    list.innerHTML = html;
                }

                // Navigation belongs to the state panel: framing a state and drilling into
                // it. A jurisdiction panel is the end of the line, so it carries none —
                // it only notes its parent state, to keep that outline lit.
                function showZoomControls(opts) {
                    zoomStateId = opts.stateId == null ? null : Number(opts.stateId);
                    zoomOutStateId = opts.parentStateId == null ? null : Number(opts.parentStateId);
                    var isState = zoomStateId != null;

                    el("lul-sb-zoom").classList.toggle("is-hidden", !isState);
                    el("lul-sb-jzdropdown").classList.toggle("is-hidden", !isState || boundsFailed);
                    setFocusState(isState ? zoomStateId : zoomOutStateId);
                    updateZoomButtons();
                    if (!isState) return;

                    el("lul-sb-jzsearch").value = "";
                    renderJurisdictionList();
                    // Warm the bounds file now so the first pick doesn't sit waiting on
                    // it. With no bounds there's nowhere to fly, so drop the picker
                    // rather than offer a list that does nothing.
                    loadJurisdictionBounds().then(function () {
                        if (boundsFailed) el("lul-sb-jzdropdown").classList.add("is-hidden");
                    });
                }

                function wireZoomControls() {
                    el("lul-sb-zoomstate").addEventListener("click", function (e) {
                        e.preventDefault();
                        zoomToStateBounds(zoomStateId);
                    });
                    // re-check after every camera change, ours or the user's
                    map.on("moveend", updateZoomButtons);
                    el("lul-sb-rows").addEventListener("click", function (e) {
                        var btn = e.target.closest(".lul-statrow-zoom");
                        if (btn) backToState(Number(btn.getAttribute("data-state")));
                    });
                    el("lul-sb-jzsearch").addEventListener("input", renderJurisdictionList);
                    el("lul-sb-jzlist").addEventListener("click", function (e) {
                        var item = e.target.closest(".lul-jz-item");
                        if (item) selectJurisdiction(item.getAttribute("data-id"));
                    });
                }

                function stateTip(p) {
                    return (
                        "<b>" +
                        (p.name || p.postcode) +
                        "</b><div class='lul-hovertip-pct'>" +
                        p.percentage +
                        "%</div><div class='lul-hovertip-note'>Population covered</div>"
                    );
                }

                function openStateBox(p) {
                    // the picker builds jurisdiction panels, which need the state's chip
                    openStateAbbr = p.postcode || "";
                    openBox({
                        kind: "State",
                        abbr: p.postcode,
                        name: p.name,
                        stateId: p.id,
                        headline: p.percentage + "%<small>population covered</small>",
                        bar: p.percentage,
                        rows: "",
                    });
                }

                // two states only: we can hand over data, or we can't yet
                function jurisdictionStatus(rec) {
                    return isAvailable(rec)
                        ? { key: "available", label: "Data Available" }
                        : { key: "unavailable", label: "Data Unavailable" };
                }

                function jurisdictionTip(p) {
                    var rec = jurisdictionById[p.id];
                    var status = jurisdictionStatus(rec);
                    // The tiles only carry the postcode, so the full name comes off the
                    // API record; fall back to the abbreviation if it hasn't loaded.
                    return (
                        "<b>" +
                        ((rec && rec.state_name) || p.st || "") +
                        "</b><div class='lul-hovertip-pct'>" +
                        p.name +
                        "</div><div class='lul-hovertip-note'>" +
                        status.label +
                        "</div>"
                    );
                }

                function openJurisdictionBox(p) {
                    var rec = jurisdictionById[p.id];
                    var status = jurisdictionStatus(rec);
                    var rows = "";
                    if (rec) {
                        rows += row("County", rec.county_name || "—");
                        rows += rec.state_name ? stateRow(rec.state_name, rec.state_id) : row("State", "—");
                    }
                    openBox({
                        kind: "Jurisdiction",
                        abbr: p.st,
                        name: p.name,
                        headline:
                            '<span class="lul-pill is-' +
                            status.key +
                            '">' +
                            status.label +
                            "</span>" +
                            // published, but there's no zoning to hand over — say so
                            // beside the status rather than in place of it
                            (isUnzoned(rec) ? '<span class="lul-pill is-unzoned">No Zoning</span>' : ""),
                        pill: true,
                        bar: null,
                        rows: rows,
                        unavailable: status.key !== "available",
                        parentStateId: rec ? rec.state_id : null,
                    });
                }

                // Which layer is live depends on zoom; min/maxzoom means only one of them
                // is ever rendered or hit-tested at a time.
                function wireLayer(layerId, opts) {
                    map.on("mousemove", layerId, function (e) {
                        if (!e.features.length) return;
                        var f = e.features[0];
                        if (!opts.interactive(f.properties)) {
                            setHover(null);
                            hideTip();
                            map.getCanvas().style.cursor = "default";
                            return;
                        }
                        setHover({ source: f.source, sourceLayer: f.sourceLayer, id: f.id });
                        showTip(opts.tip(f.properties), e.point);
                        map.getCanvas().style.cursor = "pointer";
                    });

                    map.on("mouseleave", layerId, function () {
                        setHover(null);
                        hideTip();
                        map.getCanvas().style.cursor = "default";
                    });

                    map.on("click", layerId, function (e) {
                        if (!e.features.length) return;
                        var f = e.features[0];
                        if (!opts.interactive(f.properties)) return;
                        setSelected({ source: f.source, sourceLayer: f.sourceLayer, id: f.id });
                        opts.open(f.properties);
                    });
                }

                function wireInteraction() {
                    wireLayer("states-fill", {
                        interactive: function (p) {
                            return p.isCovered !== false;
                        },
                        tip: stateTip,
                        open: openStateBox,
                    });

                    wireLayer("jurisdictions-fill", {
                        // every jurisdiction is clickable; the box says whether it's available
                        interactive: function () {
                            return true;
                        },
                        tip: jurisdictionTip,
                        open: openJurisdictionBox,
                    });

                    // clicking empty space closes the panel
                    map.on("click", function (e) {
                        var hits = map.queryRenderedFeatures(e.point, {
                            layers: ["states-fill", "jurisdictions-fill"].filter(function (l) {
                                return map.getLayer(l);
                            }),
                        });
                        if (!hits.length) closeBox();
                    });

                    wireDropdown();
                    wireZoomControls();
                    el("lul-statbox-close").addEventListener("click", closeBox);
                    document.addEventListener("keydown", function (e) {
                        if (e.key === "Escape") closeBox();
                    });

                    // legend copy tracks whichever level is on screen
                    var lastLegend = null;
                    function renderLegend() {
                        var juris = map.getZoom() >= SWAP_ZOOM;
                        if (juris === lastLegend) return;
                        lastLegend = juris;
                        var keys = juris
                            ? [
                                  [COVERED_FILL, "Available"],
                                  [UNAVAILABLE_FILL, "Not yet available"],
                              ]
                            : // no zero key: every state has at least some coverage
                              STATE_STEPS.map(function (step) {
                                  return [step.color, step.label + " covered"];
                              });
                        el("lul-legend-title").textContent = juris ? "Coverage" : "Population covered";
                        // the nudge only makes sense while there's somewhere to zoom to
                        el("lul-legend-note").classList.toggle("is-hidden", juris);
                        el("lul-legend-keys").innerHTML = keys
                            .map(function (k) {
                                return (
                                    '<div class="lul-legend-key"><i class="lul-legend-swatch" style="background:' +
                                    k[0] +
                                    '"></i><span>' +
                                    k[1] +
                                    "</span></div>"
                                );
                            })
                            .join("");
                    }
                    renderLegend();
                    map.on("zoom", renderLegend);
                }

                // ---------- load ----------
                var usingSnapshot = false;

                function loadJurisdictionData() {
                    return fetch(JURISDICTIONS_API, { credentials: "omit" })
                        .then(function (r) {
                            if (!r.ok) throw new Error("HTTP " + r.status);
                            return r.json();
                        })
                        .catch(function (err) {
                            console.warn("Live jurisdiction API unavailable, using snapshot:", err);
                            return fetch(JURISDICTIONS_SNAPSHOT)
                                .then(function (r) {
                                    if (!r.ok) throw new Error("snapshot HTTP " + r.status);
                                    return r.json();
                                })
                                .then(function (rows) {
                                    usingSnapshot = true;
                                    setStatus("Live status unavailable — showing a saved snapshot.", false);
                                    return rows;
                                });
                        });
                }

                function onMapLoad() {
                    Promise.all([
                        fetch(STATES_GEOJSON).then(function (r) {
                            if (!r.ok) throw new Error("state boundaries: HTTP " + r.status);
                            return r.json();
                        }),
                        loadJurisdictionData(),
                    ])
                        .then(function (res) {
                            var states = res[0];
                            var rows = res[1];

                            indexJurisdictions(rows);

                            simplifyBasemap();
                            var beforeId = firstSymbolLayerId();
                            // index after the join, so the stashed properties carry the
                            // coverage numbers the panel reads
                            var joined = joinStates(states);
                            indexStates(joined);
                            addStateLayers(joined, beforeId);
                            addJurisdictionLayers(beforeId);
                            addStateFocusLayer(beforeId);
                            applyAvailableState();

                            wireInteraction();
                            fitToContinentalUS();
                            if (!usingSnapshot) setStatus(null);
                        })
                        .catch(function (err) {
                            console.error(err);
                            setStatus("Failed to load the map: " + err.message, true);
                        });
                }

                // Embeds opt out of the logo + stats card with ?stats=0, so the same page
                // can be framed twice on one site: once branded, once as a bare map.
                function showInfoCard() {
                    var v = new URLSearchParams(window.location.search).get("stats");
                    return !/^(0|false|no|off|hide)$/i.test(v || "");
                }

                // independent of the map, so they don't wait on tiles or the style
                if (showInfoCard()) {
                    loadInfoStats();
                } else {
                    // skip the coverage fetch too — nothing would read it
                    document.querySelector(".lul-infocard").classList.add("is-hidden");
                }
                wireCollapsibles();

                resolveStyle().then(function (style) {
                    createMap(style).on("load", onMapLoad);
                });
            })();
        </script>
    </body>
</html>
