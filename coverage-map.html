<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>National Zoning Atlas — Coverage by State</title>
        <!-- This page is embedded in an iframe: send every link to the top-level
             window so navigation replaces the host page, not the map. -->
        <base target="_top" />
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
        <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
        <script src="https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js"></script>

        <style>
            .lul-coverage {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                color: #393348;
                max-width: 1180px;
                margin: 0 auto;
                padding: 20px 20px 20px;
                box-sizing: border-box;
                /* Fixed overall height so the iframe never needs resizing: the map
                   gives back exactly what the header takes when the stats wrap. */
                height: 740px;
                display: flex;
                flex-direction: column;
            }
            .lul-map-eyebrow {
                flex: 0 0 auto;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.6);
                margin-bottom: 20px;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                gap: 12px;
                flex-wrap: wrap;
            }

            /* own line under the title, so step out of the eyebrow's uppercase treatment */
            .lul-map-hint {
                display: block;
                font-size: 12px;
                font-weight: 400;
                letter-spacing: normal;
                text-transform: none;
                color: rgba(57, 51, 72, 0.5);
                margin-top: 6px;
            }

            /* ---- national rollup ---- */
            .lul-rollup {
                display: flex;
                gap: 28px;
                text-transform: none;
                letter-spacing: normal;
            }
            .lul-rollup div {
                text-align: right;
            }
            .lul-rollup .lul-rollup-num {
                font-size: 22px;
                font-weight: 700;
                color: #393348;
                line-height: 1.1;
                font-variant-numeric: tabular-nums;
            }
            .lul-rollup .lul-rollup-label {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.5);
                margin-top: 4px;
            }

            /* ---- map shell ---- */
            #lul-coverage-map {
                width: 100%;
                /* absorbs the leftover height rather than setting it */
                flex: 1 1 auto;
                min-height: 0;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.15);
                position: relative;
                background: #fff;
                overflow: hidden;
            }
            #lul-coverage-map canvas {
                cursor: default;
            }

            /* ---- legend ---- */
            .lul-legend {
                position: absolute;
                bottom: 12px;
                left: 12px;
                z-index: 2;
                background: #fff;
                padding: 12px 14px;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.12);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                pointer-events: none;
            }
            .lul-legend-title {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.6);
                margin-bottom: 9px;
            }
            .lul-legend-key {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 11px;
                color: rgba(57, 51, 72, 0.7);
            }
            .lul-legend-key + .lul-legend-key {
                margin-top: 7px;
            }
            .lul-legend-swatch {
                width: 13px;
                height: 13px;
                display: block;
                flex: none;
                background: rgba(57, 51, 72, 0.78);
                border: 1px solid rgba(57, 51, 72, 0.15);
            }
            .lul-legend-swatch.is-nodata {
                background: #efedec;
            }

            /* The attribution expands leftward along the bottom edge and would run into
               the legend. It starts collapsed to the ⓘ (see createMap); this caps how far
               it can reach even once expanded, so the two can never meet. */
            #lul-coverage-map .maplibregl-ctrl-bottom-right .maplibregl-ctrl-attrib {
                max-width: 55%;
            }

            /* ---- hover tooltip that follows the cursor ---- */
            .lul-hovertip {
                position: absolute;
                z-index: 5;
                pointer-events: none;
                background: #efedec;
                color: #393348;
                border: 1px solid rgba(57, 51, 72, 0.12);
                border-left: 3px solid #c9d0a0;
                border-radius: 4px;
                padding: 6px 10px;
                font-size: 11px;
                line-height: 1.25;
                white-space: nowrap;
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
                transform: translate(14px, 14px);
                opacity: 0;
                transition: opacity 0.12s ease;
            }
            .lul-hovertip.is-visible {
                opacity: 1;
            }
            .lul-hovertip b {
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                font-size: 10px;
                color: rgba(57, 51, 72, 0.55);
                display: block;
            }
            .lul-hovertip .lul-hovertip-pct {
                font-size: 15px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                margin-top: 2px;
            }
            .lul-hovertip .lul-hovertip-note {
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.55);
                margin-top: 3px;
            }

            /* published / not-published pill in the panel headline */
            .lul-pill {
                display: inline-block;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 5px 10px;
                background: #efedec;
                color: rgba(57, 51, 72, 0.65);
            }
            .lul-pill.is-published {
                background: #c9d0a0;
                color: #393348;
            }

            /* ---- pinned stats panel ---- */
            .lul-statbox {
                position: absolute;
                top: 12px;
                right: 12px;
                z-index: 6;
                width: 300px;
                background: #fff;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.15);
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.14);
                padding: 16px 18px 18px;
                box-sizing: border-box;
                display: none;
            }
            .lul-statbox.is-open {
                display: block;
            }
            .lul-statbox-close {
                position: absolute;
                top: 8px;
                right: 8px;
                border: none;
                background: none;
                font-size: 18px;
                line-height: 1;
                color: rgba(57, 51, 72, 0.4);
                cursor: pointer;
                padding: 4px 6px;
                font-family: inherit;
            }
            .lul-statbox-close:hover {
                color: #393348;
            }
            .lul-statbox-abbr {
                display: inline-block;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #393348;
                background: #e0e5c2;
                padding: 3px 8px;
                margin-bottom: 8px;
            }
            .lul-statbox-name {
                font-size: 19px;
                font-weight: 700;
                line-height: 1.15;
                margin: 0 0 10px;
                padding-right: 18px;
            }
            .lul-statbox-bar {
                height: 8px;
                background: #efedec;
                border-radius: 4px;
                overflow: hidden;
                margin-bottom: 6px;
            }
            .lul-statbox-bar i {
                display: block;
                height: 100%;
                background: #c9d0a0;
                border-radius: 4px;
                width: 0;
                transition: width 0.35s ease;
            }
            .lul-statbox-pct {
                font-size: 26px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                line-height: 1;
            }
            /* when the headline is a pill rather than a number, drop the big line box
               so the gap above it matches the gap below */
            .lul-statbox-pct.is-pill {
                font-size: 0;
            }
            .lul-statbox-pct small {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.5);
                margin-left: 6px;
            }
            .lul-statrow {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                border-top: 1px solid rgba(57, 51, 72, 0.1);
                padding: 9px 0;
                font-size: 12px;
            }
            .lul-statrow:first-of-type {
                margin-top: 14px;
            }
            .lul-statrow span {
                color: rgba(57, 51, 72, 0.6);
            }
            .lul-statrow b {
                font-size: 14px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }
            .lul-statbox-actions {
                display: flex;
                gap: 8px;
                margin-top: 14px;
            }

            /* ---- buttons: shared hero style (see buttons.html) ---- */
            .lul-hero-actions {
                --lul-header: #393348;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                color: var(--lul-header);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: left;
                gap: 18px;
                flex-wrap: wrap;
            }
            .lul-hero-actions *,
            .lul-hero-actions *::before,
            .lul-hero-actions *::after {
                box-sizing: border-box;
            }
            .lul-hero-actions .lul-hero__btn {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-weight: 500;
                font-size: 1rem;
                padding: 14px 26px;
                border-radius: 0;
                text-decoration: none;
                letter-spacing: 0.02em;
                border: 1px solid #393347;
                cursor: pointer;
                transition:
                    background 0.25s ease,
                    color 0.25s ease,
                    gap 0.25s ease;
            }
            .lul-hero-actions .lul-hero__btn--primary {
                background: #393347;
                color: #ffffff;
            }
            .lul-hero-actions .lul-hero__btn--primary:hover {
                background: #4c4460;
                border-color: #4c4460;
                gap: 12px;
            }
            .lul-hero-actions .lul-hero__btn--secondary {
                background: transparent;
                color: #393347;
            }
            .lul-hero-actions .lul-hero__btn--secondary:hover {
                background: #393347;
                color: #ffffff;
                gap: 12px;
            }
            .lul-hero-actions .lul-hero__or {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                color: var(--lul-header);
                font-size: 1rem;
                opacity: 0.7;
            }
            .lul-hero-actions .lul-hero__btn svg {
                width: 14px;
                height: 14px;
                transition: transform 0.25s ease;
            }
            .lul-hero-actions .lul-hero__btn:hover svg {
                transform: translateX(2px);
            }
            /* compact variant so the pair sits on one line inside the map panel */
            .lul-statbox-actions.lul-hero-actions {
                gap: 8px;
                flex-wrap: nowrap;
            }
            .lul-statbox-actions .lul-hero__btn {
                font-size: 0.75rem;
                padding: 9px 12px;
                gap: 6px;
                flex: 1;
                white-space: nowrap;
            }
            .lul-statbox-actions .lul-hero__btn:hover {
                gap: 9px;
            }
            .lul-statbox-actions .lul-hero__btn svg {
                width: 12px;
                height: 12px;
            }
            /* ---- unlock dropdown (see button_dropdown.html) ---- */
            .lul-data-actions {
                --lul-data-header: #393348;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                color: var(--lul-data-header);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                display: flex;
                align-items: center;
                justify-content: flex-start;
                gap: 18px;
                flex-wrap: wrap;
            }
            .lul-data-actions *,
            .lul-data-actions *::before,
            .lul-data-actions *::after {
                box-sizing: border-box;
            }
            .lul-data-actions .lul-data__dropdown {
                position: relative;
                display: inline-block;
            }
            .lul-data-actions .lul-data__btn {
                -webkit-appearance: none;
                appearance: none;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                font-weight: 500;
                font-size: 1rem;
                line-height: 1.2;
                padding: 14px 26px;
                border-radius: 0;
                text-decoration: none;
                letter-spacing: 0.02em;
                border: 1px solid #393347;
                cursor: pointer;
                transition:
                    background 0.25s ease,
                    color 0.25s ease,
                    gap 0.25s ease;
            }
            .lul-data-actions .lul-data__btn--primary {
                background: #393347;
                color: #ffffff;
            }
            .lul-data-actions .lul-data__btn--primary:hover {
                background: #4c4460;
                border-color: #4c4460;
                gap: 12px;
            }
            .lul-data-actions .lul-data__btn svg {
                width: 14px;
                height: 14px;
                transition: transform 0.25s ease;
            }
            .lul-data-actions .lul-data__dropdown.lul-is-open .lul-data__btn svg {
                transform: rotate(180deg);
            }
            .lul-data-actions .lul-data__menu {
                position: absolute;
                top: calc(100% - 1px);
                left: 0;
                min-width: 100%;
                background: #ffffff;
                border: 1px solid #393347;
                z-index: 50;
                display: none;
                flex-direction: column;
            }
            .lul-data-actions .lul-data__dropdown.lul-is-open .lul-data__menu {
                display: flex;
            }
            .lul-data-actions .lul-data__option {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-weight: 500;
                font-size: 0.95rem;
                color: #393347;
                text-decoration: none;
                white-space: nowrap;
                padding: 14px 26px;
                border-bottom: 1px solid rgba(57, 51, 71, 0.15);
                transition:
                    background 0.2s ease,
                    color 0.2s ease;
            }
            .lul-data-actions .lul-data__option:last-child {
                border-bottom: none;
            }
            .lul-data-actions .lul-data__option:hover {
                background: #393347;
                color: #ffffff;
            }

            /* compact + full-width inside the map panel */
            .lul-statbox-unlock {
                margin-top: 16px;
            }
            .lul-statbox-unlock .lul-data__dropdown {
                display: block;
                width: 100%;
            }
            .lul-statbox-unlock .lul-data__btn {
                width: 100%;
                font-size: 0.8125rem;
                padding: 11px 14px;
                gap: 7px;
            }
            .lul-statbox-unlock .lul-data__option {
                font-size: 0.8125rem;
                padding: 10px 14px;
                white-space: normal;
            }
            .lul-statbox-unlock .lul-data__btn.is-disabled,
            .lul-statbox-unlock .lul-data__btn.is-disabled:hover {
                pointer-events: none;
                cursor: default;
                background: #efedec;
                border-color: rgba(57, 51, 72, 0.12);
                color: rgba(57, 51, 72, 0.35);
                gap: 7px;
            }

            /* the line between the dropdown and the two buttons */
            .lul-statbox-prompt {
                font-size: 11px;
                line-height: 1.35;
                color: rgba(57, 51, 72, 0.55);
                margin: 12px 0 8px;
            }
            .lul-statbox-prompt.is-unpublished {
                color: rgba(57, 51, 72, 0.7);
            }

            /* nothing to buy for an unpublished jurisdiction */
            .lul-hero-actions .lul-hero__btn.is-disabled,
            .lul-hero-actions .lul-hero__btn.is-disabled:hover {
                pointer-events: none;
                cursor: default;
                background: #efedec;
                border-color: rgba(57, 51, 72, 0.12);
                color: rgba(57, 51, 72, 0.35);
                gap: 6px;
            }

            /* ---- status / error ---- */
            .lul-status {
                position: absolute;
                top: 12px;
                left: 12px;
                z-index: 6;
                background: #fff;
                border: 1px solid rgba(57, 51, 72, 0.15);
                border-left: 3px solid #c9d0a0;
                border-radius: 4px;
                padding: 10px 14px;
                font-size: 12px;
                color: rgba(57, 51, 72, 0.75);
                max-width: 360px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .lul-status.is-error {
                border-left-color: #b4413c;
            }
            .lul-status.is-hidden {
                display: none;
            }

            @media (max-width: 700px) {
                .lul-statbox {
                    width: auto;
                    left: 12px;
                    right: 12px;
                    top: auto;
                    bottom: 12px;
                }
                .lul-legend {
                    display: none;
                }
            }
        </style>

        <section class="lul-coverage">
            <div class="lul-map-eyebrow">
                <div>
                    Land Use Labs Data Coverage
                    <span class="lul-map-hint">Zoom in and click a state or jurisdiction to learn more</span>
                </div>
                <div class="lul-rollup" id="lul-rollup"></div>
            </div>

            <div id="lul-coverage-map">
                <div class="lul-status" id="lul-status">Loading coverage data…</div>

                <div class="lul-legend">
                    <div class="lul-legend-title">Coverage</div>
                    <div class="lul-legend-key">
                        <i class="lul-legend-swatch"></i><span id="lul-legend-covered">States with data coverage</span>
                    </div>
                    <div class="lul-legend-key">
                        <i class="lul-legend-swatch is-nodata" id="lul-legend-empty-swatch"></i
                        ><span id="lul-legend-empty">No data available</span>
                    </div>
                </div>

                <div class="lul-hovertip" id="lul-hovertip"></div>

                <div class="lul-statbox" id="lul-statbox">
                    <button class="lul-statbox-close" id="lul-statbox-close" type="button" aria-label="Close">
                        &times;
                    </button>
                    <div class="lul-statbox-abbr" id="lul-sb-abbr"></div>
                    <div class="lul-statbox-name" id="lul-sb-name"></div>
                    <div class="lul-statbox-pct" id="lul-sb-headline"></div>
                    <div class="lul-statbox-bar" id="lul-sb-barwrap" style="margin-top: 10px">
                        <i id="lul-sb-bar"></i>
                    </div>
                    <div id="lul-sb-rows"></div>

                    <div class="lul-statbox-unlock lul-data-actions">
                        <div class="lul-data__dropdown" id="lul-sb-dropdown">
                            <a
                                href="#"
                                role="button"
                                class="lul-data__btn lul-data__btn--primary lul-data__toggle"
                                id="lul-sb-unlock"
                            >
                                Unlock Data for this Geography
                                <svg
                                    viewBox="0 0 20 20"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M5 8l5 5 5-5"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />
                                </svg>
                            </a>
                            <div class="lul-data__menu">
                                <a class="lul-data__option" href="https://landuselabs.com/slices#order">Slices</a>
                                <a class="lul-data__option" href="https://landuselabs.com/districts#order">Districts</a>
                                <a class="lul-data__option" href="https://landuselabs.com/rasters#order">Rasters</a>
                                <a class="lul-data__option" href="https://landuselabs.com/tables#order">Tables</a>
                            </div>
                        </div>
                    </div>

                    <div class="lul-statbox-prompt" id="lul-sb-prompt">Not sure what product is right?</div>

                    <div class="lul-statbox-actions lul-hero-actions">
                        <a
                            class="lul-hero__btn lul-hero__btn--primary"
                            id="lul-sb-product"
                            href="https://landuselabs.com/product-selection"
                            >Find Product
                            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path
                                    d="M4 10h12m0 0l-5-5m5 5l-5 5"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </a>
                        <a
                            class="lul-hero__btn lul-hero__btn--secondary"
                            id="lul-sb-contact"
                            href="https://landuselabs.com/contact"
                            >Contact Us
                            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path
                                    d="M4 10h12m0 0l-5-5m5 5l-5 5"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <script>
            (function () {
                "use strict";

                // Live status for every jurisdiction. The local file is a snapshot fallback
                // for when the API can't be reached; the API is the source of truth.
                var JURISDICTIONS_API = "https://api.zoningatlas.org/atlas_jurisdictions";
                var JURISDICTIONS_SNAPSHOT = "atlas_jurisdictions.json";

                // Geometry, built by build_coverage_data.py. Rerun that when boundaries change.
                var STATES_GEOJSON = "data/states.geojson";
                var JURISDICTION_TILES = "pmtiles://data/jurisdictions.pmtiles";
                // One label anchor per jurisdiction, so multi-part ones aren't named twice.
                var JURISDICTION_LABEL_TILES = "pmtiles://data/jurisdiction_labels.pmtiles";

                // Destination for the two panel buttons. {abbr} / {state} / {name} are substituted.
                var PRODUCT_URL = "https://landuselabs.com/product-selection?state={abbr}";
                var CONTACT_URL = "https://landuselabs.com/contact?state={abbr}";

                // Basemaps. Switch by changing BASEMAP. Each entry names the schema-specific
                // bits our own layers need to agree with: which source-layers to strip, and a
                // font the style's glyph endpoint actually serves.
                var BASEMAPS = {
                    nza: {
                        style: "https://nzabasemap.blob.core.windows.net/nzabasemap/map_style_2025_11_03.json",
                        // The published style still points at the dead tiles.zoningatlas1.org
                        // host; rewrite the source to the working one at load time. Harmless
                        // once the style itself is corrected.
                        tiles: "https://tiles.zoningatlas.org/nza_merged",
                        staleTileHost: "tiles.zoningatlas1.org",
                        // protomaps schema
                        drop: ["roads", "transit_stations"],
                        font: "Montserrat SemiBold",
                        attribution: "Basemap: National Zoning Atlas",
                    },
                    carto: {
                        style: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
                        // openmaptiles schema
                        drop: ["transportation", "transportation_name", "aeroway", "building", "housenumber", "poi"],
                        font: "Open Sans Bold",
                        attribution: "Boundaries: Land Use Labs",
                    },
                };
                var BASEMAP = BASEMAPS.nza;

                // Zoom at which the state choropleth hands off to individual jurisdictions.
                var SWAP_ZOOM = 5.5;

                // How many zoom levels the handoff is spread over. Bigger = softer, more
                // gradual fade; 0 = hard cut with no fade at all. Applies to both sides:
                // states fade out over [SWAP_ZOOM - FADE, SWAP_ZOOM], jurisdictions fade
                // in over [SWAP_ZOOM, SWAP_ZOOM + FADE].
                var FADE = 0.5;

                // Opacity each layer fades to/from at the handoff. Raise these toward the
                // full values to keep more color through the transition.
                var STATE_FADE_TO = 0.7;
                var JURISDICTION_FADE_FROM = 0.5;

                var COVERED_FILL = "#393348";
                var HOVER_FILL = "#4C4460";
                var NO_DATA_FILL = "#EFEDEC"; // states we have nothing for
                var UNPUBLISHED_FILL = "#D2D0CE"; // jurisdictions that exist but aren't published
                var UNPUBLISHED_HOVER = "#BFBCB9";
                var ACCENT = "#C9D0A0";

                var el = function (id) {
                    return document.getElementById(id);
                };
                var fmt = function (n) {
                    return typeof n === "number" ? n.toLocaleString("en-US") : "—";
                };

                // ---------- map ----------
                // maplibre-gl v4 wants the promise-based handler (tilev4). The plain
                // `.tile` is a callback-style shim for maplibre v2/v3 and never resolves here.
                var pmtilesProtocol = new pmtiles.Protocol();
                maplibregl.addProtocol("pmtiles", pmtilesProtocol.tilev4 || pmtilesProtocol.tile);

                var map;

                // Fetch the style so the stale tile host baked into it can be corrected
                // before MapLibre ever sees it. Falls back to the plain URL if that fails.
                function resolveStyle() {
                    if (!BASEMAP.staleTileHost) return Promise.resolve(BASEMAP.style);
                    return fetch(BASEMAP.style)
                        .then(function (r) {
                            if (!r.ok) throw new Error("style HTTP " + r.status);
                            return r.json();
                        })
                        .then(function (style) {
                            Object.keys(style.sources || {}).forEach(function (key) {
                                var src = style.sources[key];
                                if (src.url && src.url.indexOf(BASEMAP.staleTileHost) !== -1) {
                                    src.url = BASEMAP.tiles;
                                }
                            });
                            return style;
                        })
                        .catch(function (err) {
                            console.warn("Could not patch basemap style, using it as-is:", err);
                            return BASEMAP.style;
                        });
                }

                function createMap(style) {
                    map = new maplibregl.Map({
                        container: "lul-coverage-map",
                        style: style,
                        center: [-96, 38],
                        zoom: 3.2,
                        minZoom: 2,
                        maxZoom: 13,
                        attributionControl: false,
                        dragRotate: false,
                        pitchWithRotate: false,
                        touchZoomRotate: true,
                    });
                    map.touchZoomRotate.disableRotation();
                    // controls stack in the order they're added
                    map.addControl(
                        new maplibregl.AttributionControl({
                            compact: true,
                            customAttribution: BASEMAP.attribution,
                        }),
                        "bottom-right",
                    );
                    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

                    // Start the attribution collapsed to the ⓘ so its text doesn't run
                    // across the bottom into the legend. Click still reveals the credits.
                    var attrib = map.getContainer().querySelector(".maplibregl-ctrl-attrib");
                    if (attrib) attrib.classList.remove("maplibregl-compact-show");

                    // No resize handling needed here: trackResize (on by default) already
                    // puts a debounced ResizeObserver on the container, which covers the
                    // header rewrapping. A second one fights it and flashes the canvas.

                    map.on("error", function (e) {
                        console.error("map error:", e && e.error ? e.error.message : e);
                    });
                    return map;
                }

                var status = el("lul-status");
                function setStatus(msg, isError) {
                    if (!msg) {
                        status.classList.add("is-hidden");
                        return;
                    }
                    status.classList.remove("is-hidden");
                    status.classList.toggle("is-error", !!isError);
                    status.textContent = msg;
                }

                // ---------- data ----------
                var jurisdictionById = {}; // id -> API record
                var stateStats = {}; // state_id -> { total, published, name }

                function indexJurisdictions(rows) {
                    rows.forEach(function (r) {
                        jurisdictionById[r.id] = r;
                        var s = stateStats[r.state_id];
                        if (!s) {
                            s = stateStats[r.state_id] = { total: 0, published: 0, name: r.state_name };
                        }
                        s.total += 1;
                        if (r.published) s.published += 1;
                    });
                }

                function renderRollup(rows) {
                    var pub = 0;
                    rows.forEach(function (r) {
                        if (r.published) pub += 1;
                    });
                    el("lul-rollup").innerHTML =
                        '<div><div class="lul-rollup-num">' +
                        fmt(rows.length) +
                        '</div><div class="lul-rollup-label">Total Jurisdictions</div></div>' +
                        '<div><div class="lul-rollup-num">' +
                        fmt(pub) +
                        '</div><div class="lul-rollup-label">Published</div></div>';
                }

                // Stamp the per-state rollups onto the state polygons so the paint
                // expressions can read them straight off the feature.
                function joinStates(geojson) {
                    geojson.features.forEach(function (f) {
                        var s = stateStats[f.properties.id];
                        var total = s ? s.total : 0;
                        var published = s ? s.published : 0;
                        f.properties.total_jurisdictions = total;
                        f.properties.published_jurisdictions = published;
                        f.properties.percentage = total ? Math.round((published / total) * 100) : -1;
                        // 0% counts as no coverage, same grey as a state we have nothing for.
                        f.properties.isCovered = published > 0;
                    });
                    return geojson;
                }

                // MapLibre places a symbol on every part of a MultiPolygon, so states with
                // islands get their abbreviation several times. Label off a single point per
                // state instead: the centroid of its largest polygon.
                function labelPoints(geojson) {
                    function ringArea(r) {
                        var a = 0;
                        for (var i = 0; i < r.length - 1; i++) {
                            a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
                        }
                        return a / 2;
                    }
                    function ringCentroid(r) {
                        var a = ringArea(r),
                            cx = 0,
                            cy = 0;
                        if (!a) return null;
                        for (var i = 0; i < r.length - 1; i++) {
                            var f = r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
                            cx += (r[i][0] + r[i + 1][0]) * f;
                            cy += (r[i][1] + r[i + 1][1]) * f;
                        }
                        return [cx / (6 * a), cy / (6 * a)];
                    }
                    return {
                        type: "FeatureCollection",
                        features: geojson.features
                            .map(function (f) {
                                var polys =
                                    f.geometry.type === "MultiPolygon"
                                        ? f.geometry.coordinates
                                        : [f.geometry.coordinates];
                                var biggest = polys.reduce(function (best, p) {
                                    return !best || Math.abs(ringArea(p[0])) > Math.abs(ringArea(best[0])) ? p : best;
                                }, null);
                                var pt = biggest && ringCentroid(biggest[0]);
                                if (!pt) return null;
                                return {
                                    type: "Feature",
                                    properties: f.properties,
                                    geometry: { type: "Point", coordinates: pt },
                                };
                            })
                            .filter(Boolean),
                    };
                }

                // Drop the road network and every basemap label: our own vector layers
                // already name the states and jurisdictions.
                function simplifyBasemap() {
                    (map.getStyle().layers || []).forEach(function (layer) {
                        if (layer.type === "symbol" || BASEMAP.drop.indexOf(layer["source-layer"]) !== -1) {
                            map.removeLayer(layer.id);
                        }
                    });
                }

                // Keep our fills beneath the basemap's own labels so place names read through.
                function firstSymbolLayerId() {
                    var layers = map.getStyle().layers || [];
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].type === "symbol") return layers[i].id;
                    }
                    return undefined;
                }

                // ---------- layers ----------
                function addStateLayers(geojson, beforeId) {
                    map.addSource("states", { type: "geojson", data: geojson, promoteId: "id" });

                    map.addLayer(
                        {
                            id: "states-fill",
                            type: "fill",
                            source: "states",
                            maxzoom: SWAP_ZOOM,
                            paint: {
                                "fill-color": [
                                    "case",
                                    ["boolean", ["feature-state", "hover"], false],
                                    HOVER_FILL,
                                    ["==", ["get", "isCovered"], false],
                                    NO_DATA_FILL,
                                    COVERED_FILL,
                                ],
                                // ease off approaching the handoff to jurisdictions
                                "fill-opacity": [
                                    "interpolate",
                                    ["linear"],
                                    ["zoom"],
                                    SWAP_ZOOM - FADE,
                                    0.78,
                                    SWAP_ZOOM,
                                    STATE_FADE_TO,
                                ],
                            },
                        },
                        beforeId,
                    );

                    map.addLayer(
                        {
                            id: "states-line",
                            type: "line",
                            source: "states",
                            maxzoom: SWAP_ZOOM,
                            paint: {
                                "line-color": [
                                    "case",
                                    ["boolean", ["feature-state", "selected"], false],
                                    ACCENT,
                                    "rgba(255,255,255,0.9)",
                                ],
                                "line-width": ["case", ["boolean", ["feature-state", "selected"], false], 3, 0.9],
                            },
                        },
                        beforeId,
                    );

                    map.addSource("state-labels", { type: "geojson", data: labelPoints(geojson) });
                    map.addLayer({
                        id: "states-label",
                        type: "symbol",
                        source: "state-labels",
                        minzoom: 3,
                        maxzoom: SWAP_ZOOM,
                        layout: {
                            "text-field": ["get", "postcode"],
                            "text-font": [BASEMAP.font],
                            "text-size": 11,
                            "text-letter-spacing": 0.08,
                            "text-allow-overlap": false,
                            "text-padding": 3,
                        },
                        paint: {
                            "text-color": [
                                "case",
                                ["==", ["get", "isCovered"], false],
                                "rgba(57,51,72,0.7)",
                                "#FFFFFF",
                            ],
                            "text-halo-color": [
                                "case",
                                ["==", ["get", "isCovered"], false],
                                "rgba(255,255,255,0.9)",
                                "rgba(57,51,72,0.45)",
                            ],
                            "text-halo-width": 1,
                        },
                    });
                }

                function addJurisdictionLayers(beforeId) {
                    map.addSource("jurisdictions", {
                        type: "vector",
                        url: JURISDICTION_TILES,
                        promoteId: { jurisdictions: "id" },
                    });

                    map.addLayer(
                        {
                            id: "jurisdictions-fill",
                            type: "fill",
                            source: "jurisdictions",
                            "source-layer": "jurisdictions",
                            minzoom: SWAP_ZOOM,
                            paint: {
                                "fill-color": [
                                    "case",
                                    [
                                        "all",
                                        ["boolean", ["feature-state", "hover"], false],
                                        ["boolean", ["feature-state", "published"], false],
                                    ],
                                    HOVER_FILL,
                                    ["boolean", ["feature-state", "hover"], false],
                                    UNPUBLISHED_HOVER,
                                    ["boolean", ["feature-state", "published"], false],
                                    COVERED_FILL,
                                    UNPUBLISHED_FILL,
                                ],
                                // fade in as the state fills drop away
                                "fill-opacity": [
                                    "interpolate",
                                    ["linear"],
                                    ["zoom"],
                                    SWAP_ZOOM,
                                    JURISDICTION_FADE_FROM,
                                    SWAP_ZOOM + FADE,
                                    0.8,
                                ],
                            },
                        },
                        beforeId,
                    );

                    map.addLayer(
                        {
                            id: "jurisdictions-line",
                            type: "line",
                            source: "jurisdictions",
                            "source-layer": "jurisdictions",
                            minzoom: SWAP_ZOOM,
                            paint: {
                                "line-color": [
                                    "case",
                                    ["boolean", ["feature-state", "selected"], false],
                                    ACCENT,
                                    "rgba(255,255,255,0.75)",
                                ],
                                "line-width": ["case", ["boolean", ["feature-state", "selected"], false], 2.5, 0.5],
                                "line-opacity": [
                                    "interpolate",
                                    ["linear"],
                                    ["zoom"],
                                    SWAP_ZOOM,
                                    0.35,
                                    SWAP_ZOOM + FADE,
                                    1,
                                ],
                            },
                        },
                        beforeId,
                    );

                    map.addSource("jurisdiction-labels", {
                        type: "vector",
                        url: JURISDICTION_LABEL_TILES,
                        promoteId: { jurisdiction_labels: "id" },
                    });
                    map.addLayer({
                        id: "jurisdictions-label",
                        type: "symbol",
                        source: "jurisdiction-labels",
                        "source-layer": "jurisdiction_labels",
                        minzoom: 8.5,
                        layout: {
                            "text-field": ["get", "name"],
                            "text-font": [BASEMAP.font],
                            "text-size": 11,
                            "text-allow-overlap": false,
                            "text-padding": 4,
                        },
                        paint: {
                            "text-color": [
                                "case",
                                ["boolean", ["feature-state", "published"], false],
                                "#FFFFFF",
                                "rgba(57,51,72,0.75)",
                            ],
                            "text-halo-color": [
                                "case",
                                ["boolean", ["feature-state", "published"], false],
                                "rgba(57,51,72,0.5)",
                                "rgba(255,255,255,0.9)",
                            ],
                            "text-halo-width": 1,
                        },
                    });
                }

                // Published status lives in the API, not the tiles, so it's applied as
                // feature state. MapLibre keeps this keyed by id and reapplies it to each
                // tile as it loads, so it's safe to set before any tile has arrived.
                // Feature state is per-source, so the label tiles need it too or every
                // label would fall through to the unpublished styling.
                function applyPublishedState() {
                    var targets = [
                        { source: "jurisdictions", sourceLayer: "jurisdictions" },
                        { source: "jurisdiction-labels", sourceLayer: "jurisdiction_labels" },
                    ];
                    var n = 0;
                    Object.keys(jurisdictionById).forEach(function (id) {
                        if (!jurisdictionById[id].published) return;
                        targets.forEach(function (t) {
                            map.setFeatureState(
                                { source: t.source, sourceLayer: t.sourceLayer, id: Number(id) },
                                { published: true },
                            );
                        });
                        n++;
                    });
                    return n;
                }

                function fitToStates(geojson) {
                    var b = new maplibregl.LngLatBounds();
                    geojson.features.forEach(function (f) {
                        var walk = function (c) {
                            if (typeof c[0] === "number") {
                                b.extend(c);
                                return;
                            }
                            c.forEach(walk);
                        };
                        walk(f.geometry.coordinates);
                    });
                    map.fitBounds(b, { padding: { top: 30, bottom: 40, left: 30, right: 30 }, duration: 0 });
                }

                // ---------- interaction ----------
                var hovered = null; // { source, sourceLayer, id }
                var selected = null;
                var tip = el("lul-hovertip");
                var statbox = el("lul-statbox");
                var mapEl = el("lul-coverage-map");

                function sameFeature(a, b) {
                    return a && b && a.source === b.source && a.id === b.id;
                }

                function setHover(target) {
                    if (sameFeature(hovered, target)) return;
                    if (hovered) map.setFeatureState(hovered, { hover: false });
                    hovered = target;
                    if (hovered) map.setFeatureState(hovered, { hover: true });
                }

                function setSelected(target) {
                    if (selected) map.setFeatureState(selected, { selected: false });
                    selected = target;
                    if (selected) map.setFeatureState(selected, { selected: true });
                }

                function showTip(html, point) {
                    tip.innerHTML = html;
                    tip.classList.add("is-visible");
                    positionTip(point);
                }

                function positionTip(point) {
                    var w = tip.offsetWidth,
                        h = tip.offsetHeight;
                    tip.style.transform =
                        "translate(" +
                        (point.x + w + 24 > mapEl.clientWidth ? -w - 14 : 14) +
                        "px, " +
                        (point.y + h + 24 > mapEl.clientHeight ? -h - 14 : 14) +
                        "px)";
                    tip.style.left = point.x + "px";
                    tip.style.top = point.y + "px";
                }

                function hideTip() {
                    tip.classList.remove("is-visible");
                }

                function subUrl(tpl, vars) {
                    return tpl
                        .replace("{abbr}", encodeURIComponent(vars.abbr || ""))
                        .replace("{state}", encodeURIComponent(vars.state || ""))
                        .replace("{name}", encodeURIComponent(vars.name || ""));
                }

                function row(label, value) {
                    return '<div class="lul-statrow"><span>' + label + "</span><b>" + value + "</b></div>";
                }

                var PROMPT_DEFAULT = "Not sure what product is right?";
                var PROMPT_UNPUBLISHED = "This data is unpublished. Check back or contact us for questions.";

                function closeDropdown() {
                    el("lul-sb-dropdown").classList.remove("lul-is-open");
                }

                function wireDropdown() {
                    var dd = el("lul-sb-dropdown");
                    el("lul-sb-unlock").addEventListener("click", function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        dd.classList.toggle("lul-is-open");
                    });
                    document.addEventListener("click", function (e) {
                        if (!dd.contains(e.target)) closeDropdown();
                    });
                }

                function openBox(opts) {
                    var abbr = el("lul-sb-abbr");
                    abbr.textContent = opts.abbr || "";
                    abbr.style.display = opts.abbr ? "inline-block" : "none";
                    el("lul-sb-name").textContent = opts.name;
                    var headline = el("lul-sb-headline");
                    headline.innerHTML = opts.headline;
                    headline.classList.toggle("is-pill", !!opts.pill);
                    el("lul-sb-barwrap").style.display = opts.bar == null ? "none" : "block";
                    if (opts.bar != null) el("lul-sb-bar").style.width = opts.bar + "%";
                    el("lul-sb-rows").innerHTML = opts.rows;

                    var unpublished = !!opts.unpublished;

                    var prompt = el("lul-sb-prompt");
                    prompt.textContent = unpublished ? PROMPT_UNPUBLISHED : PROMPT_DEFAULT;
                    prompt.classList.toggle("is-unpublished", unpublished);

                    // nothing to unlock for an unpublished jurisdiction
                    closeDropdown();
                    el("lul-sb-unlock").classList.toggle("is-disabled", unpublished);

                    // Find Product is dead when unpublished; Contact keeps its normal
                    // styling, since it stays a live link.
                    var product = el("lul-sb-product");
                    product.classList.toggle("is-disabled", unpublished);
                    if (unpublished) {
                        product.removeAttribute("href");
                        product.setAttribute("aria-disabled", "true");
                    } else {
                        product.href = subUrl(PRODUCT_URL, opts);
                        product.removeAttribute("aria-disabled");
                    }

                    var contact = el("lul-sb-contact");
                    contact.href = subUrl(CONTACT_URL, opts);
                    contact.removeAttribute("aria-disabled");

                    statbox.classList.add("is-open");
                }

                function closeBox() {
                    closeDropdown();
                    statbox.classList.remove("is-open");
                    setSelected(null);
                }

                function stateTip(p) {
                    return (
                        "<b>" +
                        (p.postcode || p.name) +
                        "</b><div class='lul-hovertip-pct'>" +
                        p.percentage +
                        "% published</div>"
                    );
                }

                function openStateBox(p) {
                    openBox({
                        abbr: p.postcode,
                        name: p.name,
                        state: p.name,
                        headline: p.percentage + "%<small>published</small>",
                        bar: p.percentage,
                        rows:
                            row("Total jurisdictions", fmt(p.total_jurisdictions)) +
                            row("Published", fmt(p.published_jurisdictions)) +
                            row("Remaining", fmt(p.total_jurisdictions - p.published_jurisdictions)),
                    });
                }

                function jurisdictionTip(p) {
                    var rec = jurisdictionById[p.id];
                    var published = !!(rec && rec.published);
                    return (
                        "<b>" +
                        (p.st || "") +
                        "</b><div class='lul-hovertip-pct'>" +
                        p.name +
                        "</div><div class='lul-hovertip-note'>" +
                        (published ? "Published" : "Not yet published") +
                        "</div>"
                    );
                }

                function openJurisdictionBox(p) {
                    var rec = jurisdictionById[p.id];
                    var published = !!(rec && rec.published);
                    var rows = "";
                    if (rec) {
                        rows += row("County", rec.county_name || "—");
                        rows += row("State", rec.state_name || "—");
                        if (published) {
                            rows += row("Zoning districts", fmt(rec.zone_count));
                            rows += row("Last updated", rec.updated || "—");
                        }
                    }
                    openBox({
                        abbr: p.st,
                        name: p.name,
                        state: rec ? rec.state_name : "",
                        headline:
                            '<span class="lul-pill ' +
                            (published ? "is-published" : "") +
                            '">' +
                            (published ? "Published" : "Not yet published") +
                            "</span>",
                        pill: true,
                        bar: null,
                        rows: rows,
                        unpublished: !published,
                    });
                }

                // Which layer is live depends on zoom; min/maxzoom means only one of them
                // is ever rendered or hit-tested at a time.
                function wireLayer(layerId, opts) {
                    map.on("mousemove", layerId, function (e) {
                        if (!e.features.length) return;
                        var f = e.features[0];
                        if (!opts.interactive(f.properties)) {
                            setHover(null);
                            hideTip();
                            map.getCanvas().style.cursor = "default";
                            return;
                        }
                        setHover({ source: f.source, sourceLayer: f.sourceLayer, id: f.id });
                        showTip(opts.tip(f.properties), e.point);
                        map.getCanvas().style.cursor = "pointer";
                    });

                    map.on("mouseleave", layerId, function () {
                        setHover(null);
                        hideTip();
                        map.getCanvas().style.cursor = "default";
                    });

                    map.on("click", layerId, function (e) {
                        if (!e.features.length) return;
                        var f = e.features[0];
                        if (!opts.interactive(f.properties)) return;
                        setSelected({ source: f.source, sourceLayer: f.sourceLayer, id: f.id });
                        opts.open(f.properties);
                    });
                }

                function wireInteraction() {
                    wireLayer("states-fill", {
                        interactive: function (p) {
                            return p.isCovered !== false;
                        },
                        tip: stateTip,
                        open: openStateBox,
                    });

                    wireLayer("jurisdictions-fill", {
                        // every jurisdiction is clickable; the box says whether it's published
                        interactive: function () {
                            return true;
                        },
                        tip: jurisdictionTip,
                        open: openJurisdictionBox,
                    });

                    // clicking empty space closes the panel
                    map.on("click", function (e) {
                        var hits = map.queryRenderedFeatures(e.point, {
                            layers: ["states-fill", "jurisdictions-fill"].filter(function (l) {
                                return map.getLayer(l);
                            }),
                        });
                        if (!hits.length) closeBox();
                    });

                    wireDropdown();
                    el("lul-statbox-close").addEventListener("click", closeBox);
                    document.addEventListener("keydown", function (e) {
                        if (e.key === "Escape") closeBox();
                    });

                    // legend copy tracks whichever level is on screen
                    var legendCovered = el("lul-legend-covered");
                    var legendEmpty = el("lul-legend-empty");
                    var legendEmptySwatch = el("lul-legend-empty-swatch");
                    map.on("zoom", function () {
                        var juris = map.getZoom() >= SWAP_ZOOM;
                        legendCovered.textContent = juris ? "Published" : "States with data coverage";
                        legendEmpty.textContent = juris ? "Not yet published" : "No data available";
                        legendEmptySwatch.style.background = juris ? UNPUBLISHED_FILL : NO_DATA_FILL;
                    });
                }

                // ---------- load ----------
                var usingSnapshot = false;

                function loadJurisdictionData() {
                    return fetch(JURISDICTIONS_API, { credentials: "omit" })
                        .then(function (r) {
                            if (!r.ok) throw new Error("HTTP " + r.status);
                            return r.json();
                        })
                        .catch(function (err) {
                            console.warn("Live jurisdiction API unavailable, using snapshot:", err);
                            return fetch(JURISDICTIONS_SNAPSHOT)
                                .then(function (r) {
                                    if (!r.ok) throw new Error("snapshot HTTP " + r.status);
                                    return r.json();
                                })
                                .then(function (rows) {
                                    usingSnapshot = true;
                                    setStatus("Live status unavailable — showing a saved snapshot.", false);
                                    return rows;
                                });
                        });
                }

                function onMapLoad() {
                    Promise.all([
                        fetch(STATES_GEOJSON).then(function (r) {
                            if (!r.ok) throw new Error("state boundaries: HTTP " + r.status);
                            return r.json();
                        }),
                        loadJurisdictionData(),
                    ])
                        .then(function (res) {
                            var states = res[0];
                            var rows = res[1];

                            indexJurisdictions(rows);
                            renderRollup(rows);

                            simplifyBasemap();
                            var beforeId = firstSymbolLayerId();
                            addStateLayers(joinStates(states), beforeId);
                            addJurisdictionLayers(beforeId);
                            applyPublishedState();

                            wireInteraction();
                            fitToStates(states);
                            if (!usingSnapshot) setStatus(null);
                        })
                        .catch(function (err) {
                            console.error(err);
                            setStatus("Failed to load the map: " + err.message, true);
                        });
                }

                resolveStyle().then(function (style) {
                    createMap(style).on("load", onMapLoad);
                });
            })();
        </script>
    </body>
</html>
