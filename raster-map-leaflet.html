<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Zoning Raster Sample Map - Clark County, NV</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <!-- OpenFreeMap ships a vector style; the plugin wraps a MapLibre GL canvas as a
             Leaflet layer, so the rest of this map stays plain Leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
        <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
        <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
        <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
        <script src="https://unpkg.com/georaster-layer-for-leaflet@3.10.0/dist/georaster-layer-for-leaflet.min.js"></script>

        <style>
            .lul-rastermap {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            }
            /* Raster switcher tabs. Styled to match the shared button system but with
               class names scoped to this map (lul-rastermap-*), so embedding it in a
               Squarespace page can't collide with the standalone .lul-data-* buttons. */
            .lul-rastermap-tabs {
                /* the active tab is the tertiary button: filled in ink, not the
                   primary purple */
                --lulrm-ink: #393347;
                --lulrm-ink-hover: #22202b;
                --lulrm-secondary-hover: #f9f9f9;
                --lulrm-tab-pad: 10px 26px;

                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            .lul-rastermap-tabs .lul-rastermap__tab {
                -webkit-appearance: none;
                appearance: none;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-weight: 500;
                font-size: 1rem;
                line-height: 1.2;
                padding: var(--lulrm-tab-pad);
                border: 1px solid transparent;
                border-radius: 0;
                letter-spacing: 0.02em;
                cursor: pointer;
                background: transparent;
                border-color: var(--lulrm-ink);
                color: var(--lulrm-ink);
                transition:
                    background 0.25s ease,
                    border-color 0.25s ease,
                    color 0.25s ease;
            }
            .lul-rastermap-tabs .lul-rastermap__tab:hover {
                background: var(--lulrm-secondary-hover);
            }
            .lul-rastermap-tabs .lul-rastermap__tab.lulrm-is-active {
                background: var(--lulrm-ink);
                border-color: var(--lulrm-ink);
                color: #ffffff;
            }
            .lul-rastermap-tabs .lul-rastermap__tab.lulrm-is-active:hover {
                background: var(--lulrm-ink-hover);
                border-color: var(--lulrm-ink-hover);
            }
            /* title on the left, raster tabs pushed to the right on the same line */
            .lul-rastermap__eyebrow {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
                margin-bottom: 20px;
            }
            .lul-rastermap__title {
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.6);
            }
            #lul-rastermap__canvas {
                width: 100%;
                height: 580px;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.15);
            }
            .lul-rastermap__caption {
                font-size: 12px;
                color: rgba(57, 51, 72, 0.5);
                margin-top: 10px;
            }
            .lul-rastermap__legend {
                background: #fff;
                padding: 10px 12px;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                border-radius: 0;
                border: 1px solid rgba(57, 51, 72, 0.12);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
                width: 215px;
            }
            /* square controls, consistent across all the maps */
            .leaflet-bar,
            .leaflet-bar a,
            .leaflet-bar a:first-child,
            .leaflet-bar a:last-child,
            .leaflet-control-zoom-in,
            .leaflet-control-zoom-out {
                border-radius: 0 !important;
            }
            .lul-rastermap__legend-body {
                max-height: 168px;
                overflow-y: scroll;
                margin-top: 8px;
                scrollbar-width: thin;
                scrollbar-color: rgba(57, 51, 72, 0.4) rgba(57, 51, 72, 0.08);
            }
            .lul-rastermap__legend.lulrm-is-collapsed .lul-rastermap__legend-body {
                display: none;
            }
            .lul-rastermap__legend-body::-webkit-scrollbar {
                width: 8px;
                -webkit-appearance: none;
            }
            .lul-rastermap__legend-body::-webkit-scrollbar-track {
                background: rgba(57, 51, 72, 0.08);
                border-radius: 4px;
            }
            .lul-rastermap__legend-body::-webkit-scrollbar-thumb {
                background: rgba(57, 51, 72, 0.4);
                border-radius: 4px;
            }
            .lul-rastermap__legend-body::-webkit-scrollbar-thumb:hover {
                background: rgba(57, 51, 72, 0.6);
            }
            .lul-rastermap__opacity {
                background: #fff;
                padding: 6px 10px;
                border-radius: 0;
                border: 1px solid rgba(57, 51, 72, 0.12);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .lul-rastermap__opacity-label {
                font-size: 9.5px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.5);
            }
            .lul-rastermap__opacity input[type="range"] {
                width: 80px;
                cursor: pointer;
                accent-color: #393348;
            }
            .lul-rastermap__legend-title {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.5);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                cursor: pointer;
                user-select: none;
            }
            .lul-rastermap__legend-caret {
                font-size: 9px;
                transition: transform 0.15s ease;
            }
            .lul-rastermap__legend.lulrm-is-collapsed .lul-rastermap__legend-caret {
                transform: rotate(-90deg);
            }
            .lul-rastermap__legend-row {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                font-size: 12px;
                line-height: 1.3;
                color: #393348;
                margin-bottom: 5px;
            }
            .lul-rastermap__legend-row:last-child {
                margin-bottom: 0;
            }
            .lul-rastermap__legend-row span:last-child {
                overflow-wrap: anywhere;
            }
            .lul-rastermap__legend-swatch {
                display: inline-block;
                width: 14px;
                height: 14px;
                border-radius: 2px;
                opacity: 0.85;
                flex-shrink: 0;
                margin-top: 1px;
            }
        </style>

        <div class="lul-rastermap">
            <div class="lul-rastermap__eyebrow">
                <span class="lul-rastermap__title">Zoning Raster Sample: Clark County, NV</span>
                <div class="lul-rastermap-tabs">
                    <button class="lul-rastermap__tab lulrm-is-active" data-key="general" type="button">General</button>
                    <button class="lul-rastermap__tab" data-key="residential" type="button">Residential</button>
                    <button class="lul-rastermap__tab" data-key="nonresidential" type="button">Nonresidential</button>
                </div>
            </div>
            <div id="lul-rastermap__canvas"></div>
            <p class="lul-rastermap__caption">
                Each pixel is colored by its zoning classification. Switch tabs to compare the general, residential, and
                nonresidential breakdowns.
            </p>
        </div>

        <script>
            (function () {
                // Single-band thematic rasters. Each pixel value maps to a color
                // straight from the GeoTIFF's RAT (.aux.xml). No 4-band conversion
                // needed — we color single-band values at render time below.
                //
                // Legend display names per raster come from the *_names.csv files
                // (variable -> label). Each raster has its own map because the same
                // variable can mean different things across rasters.
                var NAMES_GENERAL = {
                    protected: "Protected",
                    water: "Water",
                    wetland: "Wetland",
                    unzoned: "Unzoned",
                    residential: "Primarily Residential",
                    mixed: "Residential + Nonresidential",
                    nonresidential: "Nonresidential",
                };
                var NAMES_RESIDENTIAL = {
                    protected: "Protected",
                    water: "Water",
                    wetland: "Wetland",
                    nonresidential: "Nonresidential",
                    unzoned: "Unzoned",
                    family1_residential: "Only 1-Family Residential By Right",
                    family2_residential: "Up to 2-Family Residential By Right",
                    family3_residential: "Up to 3-Family Residential By Right",
                    family4_residential: "4-or-More-Family Residential By Right",
                    hearing_only_residential: "All Residential Uses Require a Public Hearing",
                    family1_mixed: "Only 1-Family Residential By Right + Nonresidential",
                    family2_mixed: "Up to 2-Family Residential By Right + Nonresidential",
                    family3_mixed: "Up to 3-Family Residential By Right + Nonresidential",
                    family4_mixed: "4-or-More-Family Residential By Right + Nonresidential",
                    hearing_only_mixed: "All Residential Uses Require a Public Hearing + Nonresidential",
                };
                var NAMES_NONRES = {
                    protected: "Protected",
                    water: "Water",
                    wetland: "Wetland",
                    unzoned: "Unzoned",
                    residential: "Primarily Residential",
                    industrial: "Industrial",
                    indcom: "Mixed – Industrial-Commercial Uses",
                    mining: "Mining/Extractive",
                    utility: "Utilities",
                    transport: "Transportation",
                    agindust: "Agricultural-Industrial",
                    gov: "Institutional/Government",
                    general: "Mixed – Any/All Nonresidential",
                    retail: "Retail/Service",
                    office: "Office",
                    culture: "Cultural/Entertainment/Tourist",
                    commercial: "Mixed – Specified Commercial Uses",
                    tech: "Research/Tech",
                    protected_mixed: "Open Space/Light Recreation + Residential",
                    industrial_mixed: "Industrial + Residential",
                    indcom_mixed: "Industrial-Commercial Uses + Residential",
                    mining_mixed: "Mining/Extractive + Residential",
                    utility_mixed: "Utilities + Residential",
                    transport_mixed: "Transportation + Residential",
                    agindust_mixed: "Agricultural-Industrial + Residential",
                    gov_mixed: "Institutional/Government + Residential",
                    general_mixed: "Any/All Nonresidential Uses + Residential",
                    retail_mixed: "Retail/Service + Residential",
                    office_mixed: "Office + Residential",
                    culture_mixed: "Cultural/Entertainment/Tourist + Residential",
                    commercial_mixed: "Specified Commercial Uses + Residential",
                    tech_mixed: "Research/Tech + Residential",
                };

                // classes: [pixel value, RAT variable name, [r, g, b]]
                var RASTERS = {
                    general: {
                        file: "rasters/test_general_raster_3857.tif",
                        title: "Classification",
                        names: NAMES_GENERAL,
                        classes: [
                            [0, "protected", [227, 232, 218]],
                            [1, "water", [147, 186, 196]],
                            [2, "wetland", [177, 199, 192]],
                            [3, "unzoned", [167, 172, 176]],
                            [4, "residential", [186, 173, 203]],
                            [5, "mixed", [129, 124, 164]],
                            [6, "nonresidential", [231, 218, 208]],
                        ],
                    },
                    residential: {
                        file: "rasters/test_residential_raster_3857.tif",
                        title: "Classification",
                        names: NAMES_RESIDENTIAL,
                        classes: [
                            [0, "protected", [227, 232, 218]],
                            [1, "water", [147, 186, 196]],
                            [2, "wetland", [177, 199, 192]],
                            [3, "unzoned", [167, 172, 176]],
                            [4, "nonresidential", [214, 191, 165]],
                            [5, "family1_residential", [127, 124, 164]],
                            [6, "family2_residential", [88, 88, 128]],
                            [8, "family4_residential", [31, 33, 74]],
                            [9, "hearing_only_residential", [195, 194, 240]],
                            [10, "family1_mixed", [184, 146, 164]],
                            [13, "family4_mixed", [110, 32, 80]],
                            [14, "hearing_only_mixed", [229, 210, 220]],
                        ],
                    },
                    nonresidential: {
                        file: "rasters/test_nonresidential_colorchange_3857.tif",
                        title: "Classification",
                        names: NAMES_NONRES,
                        classes: [
                            [0, "protected", [227, 232, 218]],
                            [1, "water", [147, 186, 196]],
                            [2, "wetland", [177, 199, 192]],
                            [3, "unzoned", [184, 188, 192]],
                            [4, "residential", [186, 173, 203]],
                            [5, "industrial", [191, 115, 64]],
                            [6, "indcom", [157, 76, 67]],
                            [8, "utility", [155, 155, 155]],
                            [9, "transport", [95, 112, 129]],
                            [10, "agindust", [181, 184, 79]],
                            [11, "gov", [91, 141, 184]],
                            [12, "general", [175, 146, 121]],
                            [13, "retail", [242, 193, 78]],
                            [14, "office", [74, 155, 142]],
                            [15, "culture", [232, 160, 191]],
                            [16, "commercial", [116, 94, 141]],
                            [17, "tech", [126, 200, 200]],
                            [18, "protected_mixed", [107, 122, 79]],
                            [19, "industrial_mixed", [92, 49, 20]],
                            [25, "gov_mixed", [44, 79, 114]],
                            [26, "general_mixed", [122, 90, 62]],
                            [27, "retail_mixed", [166, 124, 24]],
                            [28, "office_mixed", [35, 92, 84]],
                            [29, "culture_mixed", [160, 78, 116]],
                            [30, "commercial_mixed", [70, 54, 89]],
                            [31, "tech_mixed", [53, 122, 122]],
                        ],
                    },
                };

                var map = L.map("lul-rastermap__canvas", {
                    center: [36.17, -115.14],
                    zoom: 11,
                    zoomControl: true,
                    maxZoom: 19,
                    scrollWheelZoom: false,
                    keyboard: false,
                });

                // OpenFreeMap's Positron — the same minimalist basemap this map used to
                // take from CARTO, whose tiles now come back stamped "API KEY REQUIRED".
                // Keyless and self-hosted by OpenFreeMap: tiles, fonts and sprites all
                // come from their domain. maplibre-gl-leaflet puts the GL canvas in
                // Leaflet's tilePane, so every overlay added below still draws on top.
                var basemap = L.maplibreGL({
                    style: "https://tiles.openfreemap.org/styles/positron",
                    attribution:
                        '<a href="https://openfreemap.org">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                }).addTo(map);

                // Basemap layers to drop once the style is in, so the raster reads
                // against a flat surface:
                //   - route shields (the I-15 / US-95 badges) are busy under the colours
                //   - the landcover and park fills are what shade the mountains and open
                //     land grey-green; without them the basemap is a plain white ground
                //     and every tint on screen belongs to the zoning data
                // Street names, place names and water are kept.
                var DROP_LAYERS = [
                    "highway-shield-non-us",
                    "highway-shield-us-interstate",
                    "road_shield_us",
                    "park",
                    "landcover_wood",
                    "landcover_glacier",
                    "landcover_ice_shelf",
                    "landuse_residential",
                ];
                var glMap = basemap.getMaplibreMap();
                glMap.on("load", function () {
                    DROP_LAYERS.forEach(function (id) {
                        if (glMap.getLayer(id)) glMap.removeLayer(id);
                    });
                    // the style's ground is a faint grey; make it white to match
                    if (glMap.getLayer("background")) {
                        glMap.setPaintProperty("background", "background-color", "#ffffff");
                    }
                });

                // Build a value -> "rgb(...)" lookup from a raster's class list.
                function paletteFor(cfg) {
                    var lut = {};
                    cfg.classes.forEach(function (c) {
                        lut[c[0]] = "rgb(" + c[2][0] + "," + c[2][1] + "," + c[2][2] + ")";
                    });
                    return lut;
                }

                // Legend control, rebuilt each time the active raster changes.
                var legend = L.control({ position: "bottomright" });
                legend.onAdd = function () {
                    this._div = L.DomUtil.create("div", "lul-rastermap__legend");
                    L.DomEvent.disableClickPropagation(this._div);
                    L.DomEvent.disableScrollPropagation(this._div);
                    return this._div;
                };
                legend.addTo(map);
                function renderLegend(cfg) {
                    legend._div.innerHTML =
                        '<div class="lul-rastermap__legend-title">' +
                        "<span>" +
                        cfg.title +
                        "</span>" +
                        '<span class="lul-rastermap__legend-caret">▼</span>' +
                        "</div>" +
                        '<div class="lul-rastermap__legend-body">' +
                        cfg.classes
                            .map(function (c) {
                                return (
                                    '<div class="lul-rastermap__legend-row"><span class="lul-rastermap__legend-swatch" style="background:rgb(' +
                                    c[2][0] +
                                    "," +
                                    c[2][1] +
                                    "," +
                                    c[2][2] +
                                    ')"></span>' +
                                    "<span>" +
                                    ((cfg.names && cfg.names[c[1]]) || c[1]) +
                                    "</span></div>"
                                );
                            })
                            .join("") +
                        "</div>";
                    legend._div.querySelector(".lul-rastermap__legend-title").addEventListener("click", function () {
                        legend._div.classList.toggle("lulrm-is-collapsed");
                    });
                }

                var cache = {}; // key -> georaster
                var currentLayer = null;
                var currentOpacity = 0.75;
                var didFit = false;
                var reqToken = 0;

                function showRaster(key) {
                    var cfg = RASTERS[key];
                    var myToken = ++reqToken;
                    renderLegend(cfg);

                    function addLayer(georaster) {
                        if (myToken !== reqToken) return; // a newer tab was clicked
                        if (currentLayer) map.removeLayer(currentLayer);
                        var lut = paletteFor(cfg);
                        currentLayer = new GeoRasterLayer({
                            georaster: georaster,
                            opacity: currentOpacity,
                            resolution: 128,
                            // categorical data: map each class value to its color;
                            // unknown / no-data values render transparent.
                            pixelValuesToColorFn: function (values) {
                                return lut[values[0]] || null;
                            },
                        });
                        currentLayer.addTo(map);
                        if (!didFit) {
                            map.fitBounds(currentLayer.getBounds());
                            didFit = true;
                        }
                    }

                    if (cache[key]) {
                        addLayer(cache[key]);
                    } else {
                        fetch(cfg.file)
                            .then(function (res) {
                                if (!res.ok) throw new Error("HTTP " + res.status);
                                return res.arrayBuffer();
                            })
                            .then(parseGeoraster)
                            .then(function (georaster) {
                                cache[key] = georaster;
                                addLayer(georaster);
                            })
                            .catch(function (err) {
                                console.error("Failed to load " + cfg.file + ":", err);
                            });
                    }
                }

                // Tiny opacity slider (top-right).
                var opacityCtl = L.control({ position: "topright" });
                opacityCtl.onAdd = function () {
                    var div = L.DomUtil.create("div", "lul-rastermap__opacity");
                    div.innerHTML =
                        '<span class="lul-rastermap__opacity-label">Opacity</span>' +
                        '<input type="range" min="0" max="1" step="0.05" value="' +
                        currentOpacity +
                        '" />';
                    L.DomEvent.disableClickPropagation(div);
                    L.DomEvent.disableScrollPropagation(div);
                    div.querySelector("input").addEventListener("input", function () {
                        currentOpacity = parseFloat(this.value);
                        if (currentLayer) currentLayer.setOpacity(currentOpacity);
                    });
                    return div;
                };
                opacityCtl.addTo(map);

                var tabs = document.querySelectorAll(".lul-rastermap__tab");
                tabs.forEach(function (tab) {
                    tab.addEventListener("click", function () {
                        tabs.forEach(function (t) {
                            t.classList.remove("lulrm-is-active");
                        });
                        tab.classList.add("lulrm-is-active");
                        showRaster(tab.getAttribute("data-key"));
                    });
                });

                showRaster("general");
            })();
        </script>
    </body>
</html>
