<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Zoning Raster Sample Map (MapLibre) - Clark County, NV</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
        <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
        <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>

        <style>
            .lul-map-section {
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            }
            .lul-tabs {
                display: flex;
                gap: 8px;
                margin-bottom: 18px;
                flex-wrap: wrap;
            }
            .lul-tab {
                font-family: inherit;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.1em;
                padding: 9px 16px;
                border: 1px solid rgba(57, 51, 72, 0.15);
                background: #fff;
                color: rgba(57, 51, 72, 0.5);
                cursor: pointer;
                border-radius: 4px;
            }
            .lul-tab:hover {
                color: #393348;
                border-color: rgba(57, 51, 72, 0.35);
            }
            .lul-tab.active {
                background: #393348;
                color: #fff;
                border-color: #393348;
            }
            .lul-map-eyebrow {
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.6);
                margin-bottom: 20px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
            }
            .lul-resample {
                display: flex;
                gap: 4px;
                text-transform: none;
                letter-spacing: normal;
            }
            .lul-resample button {
                font-family: inherit;
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                padding: 6px 10px;
                border: 1px solid rgba(57, 51, 72, 0.15);
                background: #fff;
                color: rgba(57, 51, 72, 0.5);
                cursor: pointer;
                border-radius: 4px;
            }
            .lul-resample button.active {
                background: #393348;
                color: #fff;
                border-color: #393348;
            }
            #lul-raster-map {
                width: 100%;
                height: 580px;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.15);
                position: relative;
            }
            .lul-map-caption {
                font-size: 12px;
                color: rgba(57, 51, 72, 0.5);
                margin-top: 10px;
            }
            .lul-legend {
                position: absolute;
                bottom: 10px;
                right: 10px;
                z-index: 2;
                background: #fff;
                padding: 10px 12px;
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.12);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
                width: 215px;
            }
            .lul-legend-body {
                max-height: 168px;
                overflow-y: auto;
                margin-top: 8px;
                scrollbar-width: thin;
            }
            .lul-legend.collapsed .lul-legend-body {
                display: none;
            }
            .lul-legend-title {
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.5);
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                cursor: pointer;
                user-select: none;
            }
            .lul-legend-caret {
                font-size: 9px;
            }
            .lul-legend.collapsed .lul-legend-caret {
                transform: rotate(-90deg);
            }
            .lul-legend-row {
                display: flex;
                align-items: flex-start;
                gap: 8px;
                font-size: 12px;
                line-height: 1.3;
                color: #393348;
                margin-bottom: 5px;
            }
            .lul-legend-swatch {
                display: inline-block;
                width: 14px;
                height: 14px;
                border-radius: 2px;
                opacity: 0.85;
                flex-shrink: 0;
                margin-top: 1px;
            }
            .lul-opacity {
                position: absolute;
                top: 10px;
                right: 10px;
                z-index: 2;
                background: #fff;
                padding: 6px 10px;
                border-radius: 4px;
                border: 1px solid rgba(57, 51, 72, 0.12);
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .lul-opacity-label {
                font-size: 9.5px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.5);
            }
            .lul-opacity input[type="range"] {
                width: 80px;
                cursor: pointer;
                accent-color: #393348;
            }
            .lul-loading {
                position: absolute;
                inset: 0;
                z-index: 3;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255, 255, 255, 0.6);
                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: rgba(57, 51, 72, 0.6);
            }
            .lul-loading.hidden {
                display: none;
            }
        </style>

        <div class="lul-map-section">
            <div class="lul-tabs">
                <button class="lul-tab active" data-key="general" type="button">General</button>
                <button class="lul-tab" data-key="residential" type="button">Residential</button>
                <button class="lul-tab" data-key="nonresidential" type="button">Nonresidential</button>
            </div>
            <div class="lul-map-eyebrow">
                <span>Zoning Raster Sample: Clark County, NV — MapLibre GL</span>
                <span class="lul-resample">
                    <button data-mode="nearest" class="active" type="button">Nearest</button>
                    <button data-mode="linear" type="button">Linear</button>
                </span>
            </div>
            <div id="lul-raster-map">
                <div class="lul-loading" id="lul-loading">Rendering raster…</div>
                <div class="lul-opacity">
                    <span class="lul-opacity-label">Opacity</span>
                    <input type="range" min="0" max="1" step="0.05" value="0.75" id="lul-opacity-input" />
                </div>
                <div class="lul-legend" id="lul-legend"></div>
            </div>
            <p class="lul-map-caption">
                Same rasters as the Leaflet demo, rendered by MapLibre GL as a GPU texture. Toggle Nearest vs Linear to
                compare pixel resampling; nearest keeps crisp categorical edges, linear blends them.
            </p>
        </div>

        <script>
            (function () {
                var NAMES_GENERAL = {
                    protected: "Protected",
                    water: "Water",
                    wetland: "Wetland",
                    unzoned: "Unzoned",
                    residential: "Primarily Residential",
                    mixed: "Residential + Nonresidential",
                    nonresidential: "Nonresidential",
                };
                var NAMES_RESIDENTIAL = {
                    protected: "Protected",
                    water: "Water",
                    wetland: "Wetland",
                    nonresidential: "Nonresidential",
                    unzoned: "Unzoned",
                    family1_residential: "Only 1-Family Residential By Right",
                    family2_residential: "Up to 2-Family Residential By Right",
                    family3_residential: "Up to 3-Family Residential By Right",
                    family4_residential: "4-or-More-Family Residential By Right",
                    hearing_only_residential: "All Residential Uses Require a Public Hearing",
                    family1_mixed: "Only 1-Family Residential By Right + Nonresidential",
                    family2_mixed: "Up to 2-Family Residential By Right + Nonresidential",
                    family3_mixed: "Up to 3-Family Residential By Right + Nonresidential",
                    family4_mixed: "4-or-More-Family Residential By Right + Nonresidential",
                    hearing_only_mixed: "All Residential Uses Require a Public Hearing + Nonresidential",
                };
                var NAMES_NONRES = {
                    protected: "Protected",
                    water: "Water",
                    wetland: "Wetland",
                    unzoned: "Unzoned",
                    residential: "Primarily Residential",
                    industrial: "Industrial",
                    indcom: "Mixed – Industrial-Commercial Uses",
                    mining: "Mining/Extractive",
                    utility: "Utilities",
                    transport: "Transportation",
                    agindust: "Agricultural-Industrial",
                    gov: "Institutional/Government",
                    general: "Mixed – Any/All Nonresidential",
                    retail: "Retail/Service",
                    office: "Office",
                    culture: "Cultural/Entertainment/Tourist",
                    commercial: "Mixed – Specified Commercial Uses",
                    tech: "Research/Tech",
                    protected_mixed: "Open Space/Light Recreation + Residential",
                    industrial_mixed: "Industrial + Residential",
                    indcom_mixed: "Industrial-Commercial Uses + Residential",
                    mining_mixed: "Mining/Extractive + Residential",
                    utility_mixed: "Utilities + Residential",
                    transport_mixed: "Transportation + Residential",
                    agindust_mixed: "Agricultural-Industrial + Residential",
                    gov_mixed: "Institutional/Government + Residential",
                    general_mixed: "Any/All Nonresidential Uses + Residential",
                    retail_mixed: "Retail/Service + Residential",
                    office_mixed: "Office + Residential",
                    culture_mixed: "Cultural/Entertainment/Tourist + Residential",
                    commercial_mixed: "Specified Commercial Uses + Residential",
                    tech_mixed: "Research/Tech + Residential",
                };

                var RASTERS = {
                    general: {
                        file: "rasters/test_general_3857.tif",
                        title: "Classification",
                        names: NAMES_GENERAL,
                        classes: [
                            [0, "protected", [227, 232, 218]],
                            [1, "water", [147, 186, 196]],
                            [2, "wetland", [177, 199, 192]],
                            [3, "unzoned", [167, 172, 176]],
                            [4, "residential", [186, 173, 203]],
                            [5, "mixed", [129, 124, 164]],
                            [6, "nonresidential", [231, 218, 208]],
                        ],
                    },
                    residential: {
                        file: "rasters/test_residential_3857.tif",
                        title: "Classification",
                        names: NAMES_RESIDENTIAL,
                        classes: [
                            [0, "protected", [227, 232, 218]],
                            [1, "water", [147, 186, 196]],
                            [2, "wetland", [177, 199, 192]],
                            [3, "unzoned", [167, 172, 176]],
                            [4, "nonresidential", [214, 191, 165]],
                            [5, "family1_residential", [140, 124, 164]],
                            [6, "family2_residential", [101, 88, 128]],
                            [8, "family4_residential", [43, 31, 74]],
                            [9, "hearing_only_residential", [210, 194, 240]],
                            [10, "family1_mixed", [184, 146, 164]],
                            [13, "family4_mixed", [110, 32, 80]],
                            [14, "hearing_only_mixed", [229, 210, 220]],
                        ],
                    },
                    nonresidential: {
                        file: "rasters/test_nonresidential_3857.tif",
                        title: "Classification",
                        names: NAMES_NONRES,
                        classes: [
                            [0, "protected", [227, 232, 218]],
                            [1, "water", [147, 186, 196]],
                            [2, "wetland", [177, 199, 192]],
                            [3, "unzoned", [184, 188, 192]],
                            [4, "residential", [186, 173, 203]],
                            [5, "industrial", [191, 115, 64]],
                            [6, "indcom", [157, 76, 67]],
                            [8, "utility", [155, 155, 155]],
                            [9, "transport", [95, 112, 129]],
                            [10, "agindust", [181, 184, 79]],
                            [11, "gov", [91, 141, 184]],
                            [12, "general", [175, 146, 121]],
                            [13, "retail", [242, 193, 78]],
                            [14, "office", [74, 155, 142]],
                            [15, "culture", [232, 160, 191]],
                            [16, "commercial", [116, 94, 141]],
                            [17, "tech", [126, 200, 200]],
                            [18, "protected_mixed", [107, 122, 79]],
                            [19, "industrial_mixed", [92, 49, 20]],
                            [25, "gov_mixed", [44, 79, 114]],
                            [26, "general_mixed", [122, 90, 62]],
                            [27, "retail_mixed", [166, 124, 24]],
                            [28, "office_mixed", [35, 92, 84]],
                            [29, "culture_mixed", [160, 78, 116]],
                            [30, "commercial_mixed", [70, 54, 89]],
                            [31, "tech_mixed", [53, 122, 122]],
                        ],
                    },
                };

                var SRC_ID = "lul-raster";
                var LAYER_ID = "lul-raster-layer";

                var map = new maplibregl.Map({
                    container: "lul-raster-map",
                    style: {
                        version: 8,
                        sources: {
                            carto: {
                                type: "raster",
                                tiles: [
                                    "https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
                                    "https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
                                    "https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
                                ],
                                tileSize: 256,
                                attribution:
                                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
                            },
                        },
                        layers: [{ id: "carto", type: "raster", source: "carto" }],
                    },
                    center: [-115.14, 36.17],
                    zoom: 9.5,
                    scrollZoom: false,
                });
                map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-left");

                // 3857 meters -> lng/lat (WGS84) for image-source corner placement.
                var R = 6378137;
                function toLngLat(x, y) {
                    return [(x / R) * (180 / Math.PI), (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * (180 / Math.PI)];
                }

                // value -> [r,g,b] lookup for a raster config
                function paletteFor(cfg) {
                    var lut = {};
                    cfg.classes.forEach(function (c) {
                        lut[c[0]] = c[2];
                    });
                    return lut;
                }

                // Bake a single-band categorical georaster into an RGBA canvas at
                // native resolution. nodata / unmapped values -> transparent. This is
                // the key difference from the Leaflet plugin: instead of the plugin
                // re-sampling into small canvases per tile, we hand MapLibre one
                // full-res texture and let the GPU resample it (nearest or linear).
                function bakeCanvas(georaster, lut) {
                    var w = georaster.width,
                        h = georaster.height;
                    var band = georaster.values[0];
                    var canvas = document.createElement("canvas");
                    canvas.width = w;
                    canvas.height = h;
                    var ctx = canvas.getContext("2d");
                    var img = ctx.createImageData(w, h);
                    var data = img.data;
                    for (var y = 0; y < h; y++) {
                        var row = band[y];
                        var base = y * w * 4;
                        for (var x = 0; x < w; x++) {
                            var color = lut[row[x]];
                            var o = base + x * 4;
                            if (color) {
                                data[o] = color[0];
                                data[o + 1] = color[1];
                                data[o + 2] = color[2];
                                data[o + 3] = 255;
                            }
                        }
                    }
                    ctx.putImageData(img, 0, 0);
                    return canvas;
                }

                var legendEl = document.getElementById("lul-legend");
                function renderLegend(cfg) {
                    legendEl.innerHTML =
                        '<div class="lul-legend-title"><span>' +
                        cfg.title +
                        '</span><span class="lul-legend-caret">▼</span></div><div class="lul-legend-body">' +
                        cfg.classes
                            .map(function (c) {
                                return (
                                    '<div class="lul-legend-row"><span class="lul-legend-swatch" style="background:rgb(' +
                                    c[2].join(",") +
                                    ')"></span><span>' +
                                    ((cfg.names && cfg.names[c[1]]) || c[1]) +
                                    "</span></div>"
                                );
                            })
                            .join("") +
                        "</div>";
                    legendEl.querySelector(".lul-legend-title").addEventListener("click", function () {
                        legendEl.classList.toggle("collapsed");
                    });
                }

                var loadingEl = document.getElementById("lul-loading");
                var cache = {}; // key -> { canvas, coordinates }
                var currentOpacity = 0.75;
                var currentResample = "nearest";
                var reqToken = 0;
                var didFit = false;

                function placeLayer(entry) {
                    if (map.getLayer(LAYER_ID)) map.removeLayer(LAYER_ID);
                    if (map.getSource(SRC_ID)) map.removeSource(SRC_ID);
                    map.addSource(SRC_ID, {
                        type: "canvas",
                        canvas: entry.canvas,
                        coordinates: entry.coordinates,
                        animate: false,
                    });
                    map.addLayer({
                        id: LAYER_ID,
                        type: "raster",
                        source: SRC_ID,
                        paint: {
                            "raster-opacity": currentOpacity,
                            "raster-resampling": currentResample,
                            "raster-fade-duration": 0,
                        },
                    });
                    if (!didFit) {
                        map.fitBounds(
                            [entry.coordinates[3], entry.coordinates[1]], // [SW, NE] approx from BL, TR
                            { padding: 20, duration: 0 },
                        );
                        didFit = true;
                    }
                }

                function showRaster(key) {
                    var cfg = RASTERS[key];
                    var myToken = ++reqToken;
                    renderLegend(cfg);
                    if (cache[key]) {
                        placeLayer(cache[key]);
                        return;
                    }
                    loadingEl.classList.remove("hidden");
                    fetch(cfg.file)
                        .then(function (res) {
                            if (!res.ok) throw new Error("HTTP " + res.status);
                            return res.arrayBuffer();
                        })
                        .then(parseGeoraster)
                        .then(function (georaster) {
                            var canvas = bakeCanvas(georaster, paletteFor(cfg));
                            // canvas source coords: [TL, TR, BR, BL] as [lng,lat]
                            var entry = {
                                canvas: canvas,
                                coordinates: [
                                    toLngLat(georaster.xmin, georaster.ymax),
                                    toLngLat(georaster.xmax, georaster.ymax),
                                    toLngLat(georaster.xmax, georaster.ymin),
                                    toLngLat(georaster.xmin, georaster.ymin),
                                ],
                            };
                            cache[key] = entry;
                            if (myToken !== reqToken) return;
                            placeLayer(entry);
                            loadingEl.classList.add("hidden");
                        })
                        .catch(function (err) {
                            console.error("Failed to load " + cfg.file + ":", err);
                            loadingEl.textContent = "Failed to load raster";
                        });
                }

                document.getElementById("lul-opacity-input").addEventListener("input", function () {
                    currentOpacity = parseFloat(this.value);
                    if (map.getLayer(LAYER_ID)) map.setPaintProperty(LAYER_ID, "raster-opacity", currentOpacity);
                });

                document.querySelectorAll(".lul-resample button").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        document.querySelectorAll(".lul-resample button").forEach(function (b) {
                            b.classList.remove("active");
                        });
                        btn.classList.add("active");
                        currentResample = btn.getAttribute("data-mode");
                        if (map.getLayer(LAYER_ID))
                            map.setPaintProperty(LAYER_ID, "raster-resampling", currentResample);
                    });
                });

                var tabs = document.querySelectorAll(".lul-tab");
                tabs.forEach(function (tab) {
                    tab.addEventListener("click", function () {
                        tabs.forEach(function (t) {
                            t.classList.remove("active");
                        });
                        tab.classList.add("active");
                        showRaster(tab.getAttribute("data-key"));
                    });
                });

                map.on("load", function () {
                    showRaster("general");
                });
            })();
        </script>
    </body>
</html>
